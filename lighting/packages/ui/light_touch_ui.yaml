# =============================================================================
# Lighting controller — on-device LVGL commissioning/diagnostics UI
# (T-Connect Pro touchscreen)
# =============================================================================
# Composed alongside boards/t-connect-pro-display.yaml (which declares the shared
# `panel_display` / `panel_touch` hardware) by the opt-in touchscreen wrapper
# devices/light-controller-touch.yaml (which sets shared_spi_pins: "true").
# The plain devices/light-controller.yaml build (no screen) is unaffected.
#
# THE PANEL IS SMALL — the same 480x222 on 2.33" (about 54 x 25 mm) as the
# climate panel, and every layout decision below is the same consequence:
# two-character gesture labels, 18px rows, and a persistent 18px status strip
# instead of a fourth tab. It is a commissioning panel behind an enclosure door,
# not something anyone operates daily.
#
# STRUCTURE MIRRORS THE CLIMATE PANEL deliberately. Both run on identical
# hardware, both are read by the same person doing the same kind of work, and
# the two drifting apart into different idioms is the failure this shape avoids:
# shared theme package, one read-only glance tab, aligned four-column rows for
# the repeated element, semantic colour, and one status strip pinned across
# every tab. Only the subject matter differs.
#
# Layout: a 3-tab tabview, plus a status strip pinned across every tab.
#   Home    — read-only glance page: HA authority, manifest agreement, relay
#             tally, fallback counter, newest button press. Nothing here writes.
#   Relays  — 32-cell grid of relay_0..relay_31; tap a cell to toggle that coil
#             (commissioning: pulse a relay to learn which circuit it drives),
#             plus an ALL OFF reset
#   Buttons — the last 8 decoded presses as aligned rows (node | btn | gesture |
#             age), fed by this package's own capture-only can0 tap below
#   strip   — always-visible health summary + a pulsing liveness dot
#
# Values are refreshed by a single 2 s `interval:` script (matches the relay
# Modbus poll cadence), skipped entirely while LVGL is paused — which is the
# panel's steady state. The only writes are the relay-cell taps and ALL OFF.
#
# All bound ids come from packages already in devices/light-controller.yaml:
#   binary_sensor.ha_ready_sensor, sensor.fallback_events_sensor +
#     globals fallback_events / ha_hash_ok / ha_hb_seen,
#     text_sensor.binding_manifest_hash (buttons.yaml)
#   switch.relay_0 .. relay_31 + relay_store() (relay_bank.yaml/relay_channel.yaml)
# Button decode + node_map_name() come from the canbus headers the entry point
# already includes (canbus_protocol.h / node_map.h).
# =============================================================================

# Button formatters and the event log (light_ui::*). Path is relative to the
# CLI-invoked file's dir (devices/…), matching light-controller.yaml's own
# includes.
esphome:
  includes:
    - ../lighting/packages/ui/touch_ui_format.h

# Capture-only tap into can0 for the Buttons feed. buttons.yaml owns the real
# CAT_INPUT decode/forward/fallback; this second on_frame only records the press
# for display (leaves buttons.yaml untouched). Guard in the `condition:` so the
# action lambda stays a clean record-only write.
canbus:
  - id: !extend can0
    on_frame:
      - can_id: 0x02000000        # CAT_INPUT << CAT_SHIFT
        can_id_mask: 0x1E000000   # CAN_MASK_CATEGORY (category bits only)
        use_extended_id: true
        then:
          - if:
              condition:
                lambda: 'if (x.size() < BUTTON_PAYLOAD_MIN) return false; return x[0] == PROTO_V1 && payload_type(x) == MSG_BUTTON_EVENT;'
              then:
                - lambda: |-
                    light_ui::button_log_push(can_id_node(can_id),
                                              payload_button_index(x),
                                              event_type_str(payload_event_type(x)),
                                              millis());

# Colours, and the LVGL default-theme override that makes the tabview dark —
# shared with the climate panel so the two screens on identical hardware cannot
# drift apart. See that file for why `bg_color` alone is not enough.
packages:
  theme: !include ../../../packages/ui/dark_theme.yaml

lvgl:
  displays: [panel_display]
  touchscreens: [panel_touch]
  buffer_size: 25%
  # Idle sleep — same rationale as climate/packages/ui/climate_touch_ui.yaml.
  # After 5 minutes untouched, blank the backlight and pause LVGL. A paused LVGL
  # renders nothing, taking this display's share of the SPI bus it co-owns with
  # the W5500 (boards/t-connect-pro-display.yaml) to zero.
  #
  # Waking is safe: Touchscreen::loop() fires its own on_touch trigger
  # (touchscreen.cpp:139) before notifying LVGL's listener, so the handler below
  # still runs while LVGL is paused. The screen cannot get stuck dark.
  on_idle:
    timeout: 5min
    then:
      - lvgl.pause:
      - light.turn_off: display_backlight

  # ---------------------------------------------------------------------------
  # Status strip — pinned across every tab (mirrors the climate panel's).
  # ---------------------------------------------------------------------------
  # Two things that must never depend on which tab happens to be open:
  #
  #   Faults. A binding-manifest mismatch means the compiled fallback bindings
  #   and Home Assistant's bindings.yaml disagree, so a press during an HA
  #   outage may drive the wrong circuit (ADR-0009 §6) — that is the one state
  #   here worth red. HA-not-ready is amber: degraded, but it is the state the
  #   fallback path was designed for.
  #
  #   Liveness. The panel's real failure mode is showing STALE values — a frozen
  #   refresh, a wedged LVGL, a dead link — and a stale screen is
  #   indistinguishable from a quiet house. The dot pulses once per refresh, so
  #   a dot that stops moving means the values stopped meaning anything. Its
  #   colour carries the API link: green connected, amber not.
  #
  # It lives on the top layer so it survives tab switches; each tab reserves
  # 18px of bottom padding so nothing is ever hidden underneath it. Neither the
  # layer nor the strip takes touches — taps fall through to the widgets below.
  top_layer:
    bg_opa: TRANSP
    clickable: false
    widgets:
      - obj:
          id: ui_strip
          align: BOTTOM_MID
          width: 100%
          height: 18
          pad_all: 0
          pad_left: 4
          pad_right: 4
          radius: 0
          border_width: 1
          border_side: TOP
          border_color: 0x272E36
          bg_color: 0x161B22
          bg_opa: COVER
          clickable: false
          layout:
            type: flex
            flex_flow: ROW
            flex_align_cross: CENTER
            pad_column: 4
          widgets:
            - label:
                id: ui_strip_text
                flex_grow: 1
                text_color: 0x8B949E
                # Plain ASCII: the built-in Montserrat glyph set is essentially
                # ASCII, so anything typographic here risks a placeholder box.
                text: "starting"
            - obj:
                id: ui_live_dot
                width: 8
                height: 8
                radius: 4
                border_width: 0
                bg_color: 0x30363D
                bg_opa: COVER
                clickable: false

  widgets:
    - tabview:
        id: main_tabs
        position: top
        size: 26
        # The tab bar is the one raised surface on the panel; the content below
        # it sits flat on the base colour. These style the tabview's INTERNAL
        # bar and content objects — LVGL creates them itself, so the shared
        # theme map never sees them, and without this the panel keeps the stock
        # light card-on-white look.
        tab_style:
          bg_color: 0x161B22
          border_color: 0x272E36
          border_width: 1
          border_side: BOTTOM
          radius: 0
          pad_all: 0
          items:
            bg_color: 0x161B22
            bg_opa: COVER
            text_color: 0x8B949E
            border_width: 0
            radius: 0
            checked:
              bg_color: 0x30363D
              text_color: 0xE6EDF3
        content_style:
          bg_color: 0x0D1117
          bg_opa: COVER
          border_width: 0
          radius: 0
        tabs:
          # ---------------------------------------------------------------- Home
          # READ-ONLY BY CONSTRUCTION: nothing on this tab writes anything, so
          # no tap on the screen you land on can pulse a circuit in the house.
          # Was "Status", and was a stack of default-size labels; it is now the
          # same glance page the climate panel opens on, set in larger type
          # because on a screen 25 mm tall legibility is worth more than density.
          #
          # Line widths are checked against the full 474px: the longest,
          # "Fallback  0 events (0 today)" at montserrat_20, is about 300px.
          - name: "Home"
            id: tab_home
            bg_opa: TRANSP
            border_width: 0
            pad_all: 3
            pad_bottom: 18
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 2
            widgets:
              # Who is driving the lights — the one thing worth reading from
              # across the room, so it gets the largest type here. "FALLBACK"
              # is the longest option at ~140px in a 474px column.
              - label:
                  id: ui_ha_head
                  text_font: montserrat_28
                  text: "--"
              # The manifest line sits directly under the headline because the
              # two are read together: "FALLBACK" is fine, "FALLBACK" with a
              # mismatched manifest means the fallback may drive wrong circuits.
              - label:
                  id: ui_manifest
                  text_color: 0x8B949E
                  text: "Manifest --"
              - label:
                  id: ui_relays
                  text_font: montserrat_20
                  text: "Relays --"
              - label:
                  id: ui_fallback
                  text_font: montserrat_20
                  text: "Fallback --"
              - label:
                  id: ui_last_btn
                  text_font: montserrat_20
                  text_color: 0x8B949E
                  text: "Last --"
          # -------------------------------------------------------------- Relays
          # Eight cells across, four rows: 8 x 56 + 7 x 2 = 462 of the 472px
          # usable width, and 4 x 32 + 3 x 2 = 134 of the 174px between the tab
          # bar and the status strip, leaving room for ALL OFF beneath.
          #
          # A cell's fill is its coil state (checked = on, see relay_cell.yaml),
          # which is the whole readout: 32 numbers where the lit ones are the
          # circuits currently energised.
          - name: "Relays"
            id: tab_relays
            bg_opa: TRANSP
            border_width: 0
            pad_all: 2
            pad_bottom: 18
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 2
            widgets:
              - obj:
                  width: 100%
                  flex_grow: 1
                  pad_all: 0
                  border_width: 0
                  bg_opa: TRANSP
                  layout:
                    type: flex
                    flex_flow: ROW_WRAP
                    pad_row: 2
                    pad_column: 2
                  widgets:
                    - !include {file: relay_cell.yaml, vars: {relay_index: "0",  relay_label: "00"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "1",  relay_label: "01"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "2",  relay_label: "02"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "3",  relay_label: "03"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "4",  relay_label: "04"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "5",  relay_label: "05"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "6",  relay_label: "06"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "7",  relay_label: "07"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "8",  relay_label: "08"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "9",  relay_label: "09"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "10", relay_label: "10"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "11", relay_label: "11"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "12", relay_label: "12"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "13", relay_label: "13"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "14", relay_label: "14"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "15", relay_label: "15"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "16", relay_label: "16"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "17", relay_label: "17"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "18", relay_label: "18"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "19", relay_label: "19"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "20", relay_label: "20"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "21", relay_label: "21"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "22", relay_label: "22"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "23", relay_label: "23"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "24", relay_label: "24"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "25", relay_label: "25"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "26", relay_label: "26"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "27", relay_label: "27"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "28", relay_label: "28"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "29", relay_label: "29"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "30", relay_label: "30"}}
                    - !include {file: relay_cell.yaml, vars: {relay_index: "31", relay_label: "31"}}
              # The one destructive control on the panel, so it is a full-width
              # target that cannot be hit by a mis-tap on the grid above.
              - button:
                  id: btn_all_off
                  width: 100%
                  height: 26
                  widgets:
                    - label:
                        align: CENTER
                        text: "ALL OFF"
                  on_click:
                    # Via relay_store() rather than 32 named ids: the store is
                    # populated by each channel's own on_boot registration
                    # (relay_channel.yaml), so a bank resized in relay_bank.yaml
                    # cannot leave a stale channel energised here.
                    - lambda: |-
                        for (uint8_t i = 0; i < MAX_RELAYS; i++) {
                          auto *sw = relay_store(i);
                          if (sw != nullptr) sw->turn_off();
                        }
                    - script.execute: refresh_light_ui
          # ------------------------------------------------------------- Buttons
          # Eight rows of 18px plus the 16px hint = 160 of the 174px available.
          # Newest first; see button_row.yaml for why this is four columns and
          # not one formatted string.
          - name: "Buttons"
            id: tab_buttons
            bg_opa: TRANSP
            border_width: 0
            pad_all: 2
            pad_bottom: 18
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 0
            widgets:
              - label:
                  id: ui_btn_hint
                  text_color: 0x8B949E
                  text: "Press a wall button to commission it:"
              - !include {file: button_row.yaml, vars: {row_index: "0"}}
              - !include {file: button_row.yaml, vars: {row_index: "1"}}
              - !include {file: button_row.yaml, vars: {row_index: "2"}}
              - !include {file: button_row.yaml, vars: {row_index: "3"}}
              - !include {file: button_row.yaml, vars: {row_index: "4"}}
              - !include {file: button_row.yaml, vars: {row_index: "5"}}
              - !include {file: button_row.yaml, vars: {row_index: "6"}}
              - !include {file: button_row.yaml, vars: {row_index: "7"}}

# -----------------------------------------------------------------------------
# Refresh: rebuild every widget from current state on a 2 s cadence.
# -----------------------------------------------------------------------------
script:
  # ---- one script per button row (see button_refresh.yaml) ----
  - !include {file: button_refresh.yaml, vars: {row_index: "0"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "1"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "2"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "3"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "4"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "5"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "6"}}
  - !include {file: button_refresh.yaml, vars: {row_index: "7"}}

  - id: refresh_light_ui
    then:
      # Relay tally and the liveness pulse, computed once. Home and the status
      # strip both read the tally, and recomputing it in each of them is how the
      # two would drift apart.
      - lambda: |-
          int on = 0;
          for (uint8_t i = 0; i < MAX_RELAYS; i++) {
            auto *sw = relay_store(i);
            if (sw != nullptr && sw->state) on++;
          }
          id(ui_relays_on) = on;
          id(ui_blink) = !id(ui_blink);

      # ---- Home ----
      - lvgl.label.update:
          id: ui_ha_head
          text: !lambda 'return std::string(id(ha_ready_sensor).state ? "HA READY" : "FALLBACK");'
          text_color: !lambda |-
            // Ready is the normal state and gets no accent; fallback is the one
            // that should catch the eye.
            return id(ha_ready_sensor).state ? lv_color_hex(0xE6EDF3)
                                             : lv_color_hex(0xE0A24F);
      # ha_hash_ok is meaningless until the first HA heartbeat arrives (it
      # starts false), so "no HA" and "MISMATCH" are distinct states here — the
      # panel must not accuse Home Assistant of drift before it has spoken.
      - lvgl.label.update:
          id: ui_manifest
          text: !lambda |-
            std::string h = id(binding_manifest_hash).state;
            if (h.size() > 8) h = h.substr(0, 8);
            std::string agree = !id(ha_hb_seen) ? "no HA"
                                : (id(ha_hash_ok) ? "matches HA" : "MISMATCH");
            return "Manifest " + (h.empty() ? std::string("--") : h) + "  " + agree;
          text_color: !lambda |-
            return (id(ha_hb_seen) && !id(ha_hash_ok)) ? lv_color_hex(0xE05A4F)
                                                       : lv_color_hex(0x8B949E);
      - lvgl.label.update:
          id: ui_relays
          text: !lambda |-
            char b[40];
            snprintf(b, sizeof(b), "Relays  %d / %d on", id(ui_relays_on), (int) MAX_RELAYS);
            return std::string(b);
      - lvgl.label.update:
          id: ui_fallback
          text: !lambda |-
            char b[40];
            snprintf(b, sizeof(b), "Fallback  %u events", (unsigned) id(fallback_events));
            return std::string(b);
          # Any fallback firing means presses were actuated locally instead of
          # by HA, so the count is worth colouring rather than just printing.
          text_color: !lambda |-
            return id(fallback_events) > 0 ? lv_color_hex(0xE0A24F)
                                           : lv_color_hex(0xE6EDF3);
      - lvgl.label.update:
          id: ui_last_btn
          text: !lambda |-
            const auto *e = light_ui::button_log_at(0);
            if (e == nullptr) return std::string("Last  no button events yet");
            return light_ui::fmt_last_button(node_map_name(e->node_id), e->button,
                                             e->event, (millis() - e->ms) / 1000);

      # ---- Relay grid (see relay_refresh.yaml) ----
      - !include {file: relay_refresh.yaml, vars: {relay_index: "0"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "1"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "2"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "3"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "4"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "5"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "6"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "7"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "8"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "9"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "10"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "11"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "12"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "13"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "14"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "15"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "16"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "17"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "18"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "19"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "20"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "21"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "22"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "23"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "24"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "25"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "26"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "27"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "28"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "29"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "30"}}
      - !include {file: relay_refresh.yaml, vars: {relay_index: "31"}}

      # ---- Button rows ----
      - script.execute: ui_refresh_brow_0
      - script.execute: ui_refresh_brow_1
      - script.execute: ui_refresh_brow_2
      - script.execute: ui_refresh_brow_3
      - script.execute: ui_refresh_brow_4
      - script.execute: ui_refresh_brow_5
      - script.execute: ui_refresh_brow_6
      - script.execute: ui_refresh_brow_7

      # ---- Status strip ----
      # Fault precedence: a manifest mismatch outranks HA being down, because it
      # is the one that makes the fallback itself untrustworthy.
      - lvgl.widget.update:
          id: ui_strip
          bg_color: !lambda |-
            if (id(ha_hb_seen) && !id(ha_hash_ok)) return lv_color_hex(0x5A1F1C);
            if (!id(ha_ready_sensor).state) return lv_color_hex(0x4A3A1F);
            return lv_color_hex(0x161B22);
      - lvgl.label.update:
          id: ui_strip_text
          text: !lambda |-
            char b[64];
            if (id(ha_hb_seen) && !id(ha_hash_ok)) {
              snprintf(b, sizeof(b), "ALARM  binding manifest mismatch");
            } else if (!id(ha_ready_sensor).state) {
              snprintf(b, sizeof(b), "FALLBACK  HA not ready - relays driven locally");
            } else {
              snprintf(b, sizeof(b), "HA ready   relays %d/%d on   fallback %u",
                       id(ui_relays_on), (int) MAX_RELAYS,
                       (unsigned) id(fallback_events));
            }
            return std::string(b);
          text_color: !lambda |-
            bool degraded = (id(ha_hb_seen) && !id(ha_hash_ok)) || !id(ha_ready_sensor).state;
            return degraded ? lv_color_hex(0xE6EDF3) : lv_color_hex(0x8B949E);
      # Pulse: alternates every refresh, so movement means the loop is alive.
      # Colour is the API link — green connected, amber not.
      - lvgl.widget.update:
          id: ui_live_dot
          bg_color: !lambda |-
            if (!id(ui_blink)) return lv_color_hex(0x30363D);
            return id(panel_api_status).state ? lv_color_hex(0x3FB950)
                                              : lv_color_hex(0xE0A24F);

# Wake on touch: restore the backlight and resume rendering, then repaint
# immediately so the first thing shown is current rather than 5-minutes stale.
touchscreen:
  - id: !extend panel_touch
    on_touch:
      - light.turn_on: display_backlight
      - lvgl.resume:
      - script.execute: refresh_light_ui

# API link state for the strip's liveness dot. "API connected" also implies the
# network is up, which is why the dot needs no separate link indicator. Note
# this is NOT the same thing as ha_ready_sensor, which additionally requires a
# live HA heartbeat and a matching manifest — a laptop log session connects the
# API without making HA the authority.
binary_sensor:
  - platform: status
    id: panel_api_status
    name: "API Connected"
    entity_category: diagnostic

interval:
  - interval: 2s
    then:
      # Skipped while the panel sleeps. A paused LVGL discards these updates
      # anyway, so this is ~50 lambda evaluations and widget writes per 2 s that
      # bought nothing — and it kept invalidating regions on the SPI bus the
      # display shares with the W5500.
      - if:
          condition:
            not:
              lvgl.is_paused:
          then:
            - script.execute: refresh_light_ui

globals:
  # Relay tally, recomputed once per refresh (see refresh_light_ui).
  - id: ui_relays_on
    type: int
    initial_value: '0'
  # Toggled every refresh to drive the status strip's liveness pulse.
  - id: ui_blink
    type: bool
    initial_value: 'false'
