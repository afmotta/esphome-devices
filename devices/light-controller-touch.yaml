# Build: lighting controller WITH the onboard T-Connect Pro touchscreen UI.
#
# Identical to devices/light-controller.yaml (button events + relay bank) plus
# the two additive display packages: the shared display hardware and the
# lighting commissioning/diagnostics UI. It keeps light-controller.yaml's
# Ethernet, with the display sharing the W5500's SPI controller — see the
# CHANGED note below and boards/t-connect-pro-display.yaml.
#
# Lives in devices/ (not devices/locals/) alongside its base entry point:
# light-controller.yaml is compiled directly (no locals/remotes wrapper, by
# design), and its esphome.includes: resolve relative to the CLI-invoked file's
# dir — so the touch variant must share that dir for those `../canbus/...` paths
# to keep resolving. Identity, secrets and the can0 bus definition all come from
# the included light-controller.yaml.
#
# Flash this variant to the lighting controller that has the panel; the plain
# light-controller.yaml build (no screen) is unchanged.
substitutions:
  # This build previously forced WiFi purely because the display and the W5500
  # could not coexist. That limitation is fixed — both now share one SPI
  # controller (spi2), arbitrated by their CS lines — so the lighting controller
  # keeps the wired networking ADR-0014 specified for it, including the
  # arbitration heartbeats. It inherits the board's Ethernet+WiFi multi-interface
  # config (Ethernet preferred, WiFi fallback); the W5500 is always present on the
  # shared bus, which is exactly what shared_spi_pins "true" accounts for.
  #
  # Both the ethernet block and the display's spi bus name GPIO12/11/13, so
  # ESPHome's pin bookkeeping needs them marked.
  shared_spi_pins: "true"
  # external_components paths resolve against THIS file's directory (devices/).
  esphome_overrides_path: ../libs/esphome_overrides

packages:
  - !include "light-controller.yaml"
  - !include "../boards/t-connect-pro-display.yaml"
  - !include "../lighting/packages/ui/light_touch_ui.yaml"
