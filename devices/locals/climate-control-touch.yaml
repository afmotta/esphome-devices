# Local build: climate controller WITH the onboard T-Connect Pro touchscreen UI.
#
# Identical to devices/locals/climate-control.yaml (wired Ethernet + full climate
# system) plus the two additive display packages. Ethernet AND the panel both run,
# sharing one SPI controller (spi2) arbitrated by their CS lines — see
# boards/t-connect-pro-display.yaml for the mechanism and ADR-0016 for why this
# needs the local fork of the ethernet component.
#
# Verified on hardware 2026-07-25, including a 30 fps full-screen redraw stress
# test with no ethernet packet loss. In service the panel is behind an enclosure
# door in the technical room and idles asleep (see climate_touch_ui.yaml), so the
# bus is effectively uncontended.
#
# Flash this variant to the device that has the panel; the plain
# climate-control.yaml build (no screen) is unchanged.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  encryption_key: !secret encryption_key
  ota_password: !secret ota_password
  # Both the ethernet block and the display's spi bus name GPIO12/11/13, so
  # ESPHome's pin bookkeeping needs them marked. Valid because they genuinely
  # share one controller here.
  shared_spi_pins: "true"
  # external_components paths resolve against THIS file's directory — one level
  # deeper than devices/, same as room-sensor-soggiorno.yaml's s1_pro_libs_path.
  esphome_overrides_path: ../../libs/esphome_overrides

packages:
  - !include "../climate-control.yaml"
  - !include "../../boards/t-connect-pro-display.yaml"
  - !include "../../climate/packages/ui/climate_touch_ui.yaml"
