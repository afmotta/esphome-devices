# =============================================================================
# Bring-up / regression firmware — shared panel half (display + touch + UI)
# =============================================================================
# Everything EXCEPT the network, so the two variants differ by exactly one
# variable — which is the whole point of the experiment:
#
#   t-connect-pro-debug.yaml       Ethernet (W5500 on GPIO12/11/13) + this panel
#   t-connect-pro-debug-wifi.yaml  WiFi (touches none of those pads) + this panel
#
# Each variant supplies a text_sensor with id `dbg_ip` (ethernet_info / wifi_info)
# which the network line below reads, and sets `shared_spi_pins` — "true" only in
# the Ethernet build, where the W5500 genuinely co-claims the display's pads.
# ESPHome rejects a lone allow_other_uses when nothing else claims the pin, so
# the WiFi build must leave it "false".
#
# Deliberately self-contained: pulls in no repo packages (no boards/, no
# climate/), so the repo's composition layering is not a variable here.
#
# How to read the screen:
#   tick N   — increments every 1 s. Frozen tick = display flush died.
#   eth/wifi — IP + API state.
#   touch:   — raw and transform-mapped coordinates of the last touch.
#   corners  — tap each of the four corner buttons; the label names the one the
#              UI thinks was hit, which is how you confirm the touch transform.
#
# TRACKED HARNESS — do not delete. CLAUDE.md's ESPHome-upgrade procedure and
# ADR-0016's verification section both reference these builds: they are how you
# re-prove the libs/esphome_overrides/ethernet fork after an upstream bump.
# =============================================================================

# Each variant supplies its own ${debug_name} so the two get separate build
# directories — sharing one makes every switch between them a dirty ESP-IDF
# reconfigure that fails outright.
esphome:
  name: ${debug_name}
  friendly_name: "T-Connect Pro Debug"
  min_version: 2026.7.0
  comment: "Temporary display/touch bring-up firmware"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Global VERBOSE so the cst226 driver's raw "Read touch" values (logged at
# VERBOSE) come through for comparison against the on-screen mapped coordinates —
# ESPHome refuses a per-tag level more verbose than the global one. The chatty
# components that would otherwise bury them are dialled back individually.
logger:
  level: VERBOSE
  logs:
    cst226.touchscreen: VERBOSE
    lvgl: WARN
    display: WARN
    mipi_spi: WARN
    spi: WARN
    ethernet: INFO
    wifi: INFO
    api: INFO
    sensor: WARN
    text_sensor: WARN
    component: WARN
    scheduler: WARN

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# -----------------------------------------------------------------------------
# Display SPI.
# -----------------------------------------------------------------------------
# ESPHome's W5500 driver owns a hardware SPI controller directly (hardcoded
# SPI2_HOST) rather than using the `spi:` hub, so each variant chooses where this
# bus lands:
#   spi3 (-debug.yaml, -debug-wifi.yaml) — a SECOND controller. On the Ethernet
#     variant that is the reproduction of the original bug: two controllers aimed
#     at the same pads, which the silicon cannot do.
#   spi2 (-debug-shared.yaml) — the SAME controller the W5500 uses, the fix.
spi:
  - id: display_spi
    # spi3 in the plain Ethernet/WiFi variants; the shared-bus variant overrides
    # this to spi2 so the panel lands on the SAME controller as the W5500.
    interface: ${display_spi_interface}
    clk_pin:
      number: GPIO12
      allow_other_uses: ${shared_spi_pins}
    mosi_pin:
      number: GPIO11
      allow_other_uses: ${shared_spi_pins}
    miso_pin:
      number: GPIO13
      allow_other_uses: ${shared_spi_pins}

i2c:
  - id: i2cbus
    sda: GPIO39
    scl: GPIO40
    # Left on (unlike the board file) — a bring-up build wants the boot-time scan
    # to confirm the CST226SE actually answers on the bus.
    scan: true
    frequency: 100kHz

output:
  - platform: ledc
    # GPIO46 is a strapping pin but is the panel backlight by board design
    # (LilyGO pin_config.h SCREEN_BL=46), so the warning is expected.
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    model: ST7796
    id: panel_display
    spi_id: display_spi
    cs_pin: GPIO21
    dc_pin: GPIO41
    # No reset_pin — panel reset is tied on the module, so mipi_spi does a
    # software reset instead. Geometry mirrors boards/t-connect-pro-display.yaml:
    # logical landscape 480x222 seated in the ST7796's 480x320 swapped GRAM by
    # offset_height 49 = (320-222)/2.
    dimensions:
      width: 480
      height: 222
      offset_width: 0
      offset_height: 49
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never   # LVGL owns flushing

touchscreen:
  - platform: cst226
    id: panel_touch
    i2c_id: i2cbus
    # The CST226 INT idles high and pulses low; ESPHome's driver attaches a
    # FALLING interrupt without a pull-up, so GPIO3 must be pulled up here or
    # touch is silently dead. GPIO3 is a strapping pin but is TOUCH_INT by board
    # design.
    interrupt_pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    reset_pin: GPIO47
    # HARDWARE-VERIFIED 2026-07-25 via the corner buttons: the starting values
    # (mirror_x true / mirror_y false) put touch a full 180° out — TL reported
    # BOTTOM-RIGHT and BR reported TOP-LEFT. Both axes reversed, so both mirror
    # flags flip; a point reflection commutes with the swap_xy above, so the
    # swap stays as-is.
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      - lambda: |-
          id(touch_count) += 1;
          id(touch_raw_x) = touch.x_raw;
          id(touch_raw_y) = touch.y_raw;
          id(touch_map_x) = touch.x;
          id(touch_map_y) = touch.y;
      - script.execute: refresh_touch_line
      # WARN so it stays visible even if the log level is dialled back. Touch
      # runs over i2c, entirely independent of the SPI pads — so these lines
      # appear even when the display itself is receiving nothing.
      - logger.log:
          format: "TOUCH #%u raw=%d/%d mapped=%d/%d"
          args:
            ['id(touch_count)', 'touch.x_raw', 'touch.y_raw', 'touch.x', 'touch.y']
          level: WARN

# -----------------------------------------------------------------------------
# Minimal UI: one static string, a liveness tick, a network line, and the touch
# readouts. Four corner buttons verify the touch<->display axis mapping.
# -----------------------------------------------------------------------------
lvgl:
  displays: [panel_display]
  touchscreens: [panel_touch]
  buffer_size: 25%
  bg_color: 0x101418
  text_color: 0xEAEAEA
  widgets:
    - label:
        id: lbl_title
        align: TOP_MID
        y: 6
        text: "T-Connect Pro - debug build"
    - label:
        id: lbl_net
        align: TOP_MID
        y: 28
        text_color: 0x9AA0A6
        text: "net --   api --"
    - label:
        id: lbl_beat
        align: CENTER
        y: -22
        text: "tick 0"
    - label:
        id: lbl_touch
        align: CENTER
        y: 2
        text_color: 0xF0C040
        text: "touch: none yet"
    - label:
        id: lbl_corner
        align: CENTER
        y: 24
        text_color: 0x6FCF97
        text: "corner: tap one"
    # Corner targets — tap each and check the label names the corner you actually
    # touched. A mismatch means the touch transform above needs a mirror flipped.
    - button:
        id: btn_tl
        align: TOP_LEFT
        width: 74
        height: 46
        bg_color: 0x8A2A2A
        widgets:
          - label: {align: CENTER, text: "TL"}
        on_click:
          - lvgl.label.update: {id: lbl_corner, text: "corner: TOP-LEFT"}
    - button:
        id: btn_tr
        align: TOP_RIGHT
        width: 74
        height: 46
        bg_color: 0x24507A
        widgets:
          - label: {align: CENTER, text: "TR"}
        on_click:
          - lvgl.label.update: {id: lbl_corner, text: "corner: TOP-RIGHT"}
    - button:
        id: btn_bl
        align: BOTTOM_LEFT
        width: 74
        height: 46
        bg_color: 0x2F6F4F
        widgets:
          - label: {align: CENTER, text: "BL"}
        on_click:
          - lvgl.label.update: {id: lbl_corner, text: "corner: BOTTOM-LEFT"}
    - button:
        id: btn_br
        align: BOTTOM_RIGHT
        width: 74
        height: 46
        bg_color: 0x6A4A8A
        widgets:
          - label: {align: CENTER, text: "BR"}
        on_click:
          - lvgl.label.update: {id: lbl_corner, text: "corner: BOTTOM-RIGHT"}

globals:
  - id: touch_count
    type: uint32_t
    initial_value: '0'
  - id: touch_raw_x
    type: int
    initial_value: '0'
  - id: touch_raw_y
    type: int
    initial_value: '0'
  - id: touch_map_x
    type: int
    initial_value: '0'
  - id: touch_map_y
    type: int
    initial_value: '0'
  - id: beat
    type: uint32_t
    initial_value: '0'
  # Redraw-stress mode (shared-bus test). Off by default.
  - id: stress_on
    type: bool
    initial_value: 'false'

script:
  - id: refresh_touch_line
    then:
      - lvgl.label.update:
          id: lbl_touch
          text: !lambda |-
            char b[64];
            snprintf(b, sizeof(b), "touch #%u  raw %d/%d  map %d/%d",
                     (unsigned) id(touch_count), id(touch_raw_x), id(touch_raw_y),
                     id(touch_map_x), id(touch_map_y));
            return std::string(b);

# 1 s heartbeat: proves the display is still being flushed, and re-reads the
# network state.
interval:
  # Redraw stress: invalidate the WHOLE screen at ~30 fps so LVGL continuously
  # flushes full buffers over SPI. On the shared-bus build this is the worst
  # case for the W5500 — the display holds the bus lock for each buffer write —
  # so it is the test that decides whether sharing is actually viable. Toggle
  # with the boot button and watch ping latency.
  - interval: 33ms
    then:
      - if:
          condition:
            lambda: 'return id(stress_on);'
          then:
            - lvgl.widget.redraw

  - interval: 1s
    then:
      - lambda: 'id(beat) += 1;'
      - lvgl.label.update:
          id: lbl_beat
          text: !lambda |-
            char b[64];
            snprintf(b, sizeof(b), "tick %u   up %us   %s",
                     (unsigned) id(beat), (unsigned) (millis() / 1000),
                     id(stress_on) ? "STRESS" : "idle");
            return std::string(b);
      - lvgl.label.update:
          id: lbl_net
          text: !lambda |-
            std::string ip = id(dbg_ip).state;
            if (ip.empty()) ip = "--";
            return "net " + ip + "   api " + (id(api_status).state ? "up" : "down");

binary_sensor:
  - platform: status
    id: api_status
    name: "Status"

  # Boot button toggles redraw stress rather than restarting — during the
  # shared-bus test this is the control you actually want at the bench, and
  # "Restart" is still exposed as a button entity over the API.
  - platform: gpio
    name: "Boot Button"
    pin:
      number: 0
      ignore_strapping_warning: true
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - lambda: 'id(stress_on) = !id(stress_on);'
        # WARN so these transitions are easy to correlate against a ping log.
        - logger.log:
            format: "STRESS %s"
            args: ['id(stress_on) ? "ON" : "OFF"']
            level: WARN

button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config
