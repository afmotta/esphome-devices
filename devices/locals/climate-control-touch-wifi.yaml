# Local build: climate controller WITH the onboard touchscreen UI, on WiFi.
#
# Same composition as devices/locals/climate-control-touch.yaml (full climate
# system + display + touch UI) but running WiFi instead of Ethernet:
#   - enable_ethernet: false  -> the board selects its WiFi package
#   - shared_spi_pins: false  -> with Ethernet off, nothing else claims the
#     display's SCLK/MOSI/MISO (GPIO12/11/13), so the display owns them outright
#     and must NOT mark them allow_other_uses (that is only valid when the W5500
#     genuinely co-claims the pads). This is the inverse of the Ethernet touch
#     build, which sets both to true.
#
# enable_ethernet is passed via `vars:` on the climate-control.yaml include (not
# a sibling substitution): climate-control.yaml defines it in its `defaults:`,
# and ESPHome's `defaults:` mechanism only yields to vars passed on that specific
# include.
substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  encryption_key: !secret encryption_key
  ota_password: !secret ota_password
  shared_spi_pins: "false"
  # boards/t-connect-pro-display.yaml declares the forked `ethernet` component
  # unconditionally, so the path has to resolve even here where no `ethernet:`
  # block exists for it to shadow. The fork is inert in this build — nothing
  # references the component — but external_components validates the directory.
  esphome_overrides_path: ../../libs/esphome_overrides

packages:
  climate: !include
    file: "../climate-control.yaml"
    vars:
      enable_ethernet: false
  display: !include "../../boards/t-connect-pro-display.yaml"
  touch_ui: !include "../../climate/packages/ui/climate_touch_ui.yaml"
