# =============================================================================
# Bring-up / regression firmware — Ethernet + display on ONE shared SPI controller
# =============================================================================
# The actual fix attempt. Both the W5500 and the ST7796 panel live on SPI2_HOST
# and are arbitrated by their distinct CS lines (W5500 CS=10, display CS=21) —
# which is what LilyGO's own Arduino code does, and the only arrangement the
# silicon allows: an ESP32-S3 pad has exactly one output source, so two SPI
# controllers aimed at GPIO12/11/13 can never both work (see
# t-connect-pro-debug.yaml for that failure mode).
#
# Three things make this configuration possible, all of them in the local fork
# of the ethernet component at libs/esphome_overrides/ethernet/:
#
#   1. `spi:` (setup_priority BUS 1000) initialises SPI2_HOST first, with the
#      correct pins. GPIO11/12/13 are SPI2's native IO_MUX pads, so this is the
#      direct route, not the GPIO matrix.
#   2. ethernet (setup_priority WIFI 250) then finds the host already up. The
#      fork treats the resulting ESP_ERR_INVALID_STATE as the success path
#      instead of marking the component failed.
#   3. esp_eth_mac_new_w5500() only needs spi_bus_add_device() onto that bus
#      (ESPHome's own w5500_custom_spi.cpp does exactly this), which is legal on
#      a bus owned by `spi:`.
#
# Concurrency is handled by ESP-IDF: the display's delegate takes the bus lock
# per transaction (spi_device_acquire_bus in begin_transaction, released in
# end_transaction — spi_esp_idf.cpp:33/44), so W5500 traffic interleaves between
# display transactions rather than being locked out. The bus is initialised with
# max_transfer_sz 4092, comfortably above the W5500's ~1524-byte frames.
#
# WHAT TO WATCH FOR — this is the experiment, not a proven result:
#   - Both `tick` incrementing AND an `eth <ip>` line = the fix works.
#   - Ethernet up but display frozen, or vice versa = bus arbitration is not
#     holding; report which one died.
#   - Watch the log for stalls or w5500 timeouts during heavy redraws: the
#     display holds the bus for a full buffer write (~13KB), a bounded few-ms
#     stall for ethernet. TCP absorbs that, but it is the thing most likely to
#     misbehave under load.
#
# TRACKED HARNESS — do not delete. CLAUDE.md's ESPHome-upgrade procedure and
# ADR-0016's verification section both reference these builds: they are how you
# re-prove the libs/esphome_overrides/ethernet fork after an upstream bump.
# =============================================================================

substitutions:
  debug_name: t-connect-pro-debug-shared
  # THE key line: the panel goes on spi2, the same controller the W5500 uses,
  # instead of the spi3 the other variants use.
  display_spi_interface: spi2
  # Two config blocks legitimately name the same pads now, so ESPHome's pin
  # bookkeeping still needs them marked — but here the claim is real and
  # arbitrated, rather than a papered-over conflict.
  shared_spi_pins: "true"

# Local fork of the core `ethernet` component. External components are inserted
# at sys.meta_path position 0 (loader.py install_meta_finder), so this shadows
# the built-in. Path resolves against THIS file's directory — same convention as
# boards/s1-pro-multi-sense.yaml's s1_pro_libs_path.
external_components:
  - source:
      type: local
      path: ../../libs/esphome_overrides
    components: [ethernet]

packages:
  panel: !include t-connect-pro-debug-panel.yaml

ethernet:
  type: W5500
  # Must match display_spi_interface above — that is the whole point. Upstream
  # ESPHome rejects this as a conflict (__init__.py _final_validate_spi); the
  # fork downgrades it to an informational log.
  interface: spi2
  clk_pin:
    number: GPIO12
    allow_other_uses: true
  mosi_pin:
    number: GPIO11
    allow_other_uses: true
  miso_pin:
    number: GPIO13
    allow_other_uses: true
  cs_pin: GPIO10
  interrupt_pin: GPIO9
  reset_pin: GPIO48

text_sensor:
  - platform: ethernet_info
    ip_address:
      id: dbg_ip
      name: "IP Address"
