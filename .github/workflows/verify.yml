name: Verify

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running checks (the ESP32 compile is the slow
# one); pushes to main always run to completion.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native verification battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run native verification battery
        run: bash scripts/verification-battery.sh --native-only

  # Same checks as the yamllint + repo-hygiene hooks in .pre-commit-config.yaml.
  lint:
    name: YAML lint + repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install "yamllint==1.37.1"
      - name: yamllint (config in .yamllint)
        run: yamllint --strict -c .yamllint .
      - name: Repo hygiene
        run: python3 scripts/check_repo_hygiene.py

  esphome-config:
    name: ESPHome config gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ESPHome (repo pin)
        run: pip install "esphome==2026.8.0"
      - name: Generate CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh
      - name: Validate entry points
        run: |
          set -euo pipefail
          for f in \
            devices/locals/climate-control.yaml \
            devices/locals/wall-sensor.yaml \
            devices/locals/room-sensor-soggiorno.yaml \
            devices/light-controller.yaml \
            devices/health-monitor.yaml \
            devices/an-penta-1.yaml \
            devices/an-quad-1.yaml \
            canbus/tests/compile_bridge.yaml \
            canbus/tests/compile_buttons_bridge.yaml \
            canbus/tests/compile_bridge_t2can.yaml \
            climate/tests/compile_can_sensor_receiver.yaml \
            climate/tests/harness/room_sensors.yaml \
            climate/tests/harness/radiant_direction.yaml \
            climate/tests/harness/fancoil_boost.yaml \
            climate/tests/harness/outdoor.yaml \
            climate/tests/harness/mev_ventilation.yaml \
            climate/tests/harness/pid_behaviour.yaml
          do
            echo "::group::esphome config $f"
            esphome config "$f" >/dev/null
            echo "::endgroup::"
          done
      # Review R-18: package on_boot hooks must stay one trigger each at their
      # declared priority (the source-form check runs in the native battery).
      - name: Resolved on_boot triggers match the baseline
        run: python3 scripts/check_on_boot_resolved.py

  # Host-platform e2e: each harness compiles to a plain Linux binary (no ESP32
  # toolchain), so this is cheap enough to gate every PR as well as pushes to main.
  # Every harness binds the fixed native-API port 6053 and conftest.py fails fast if
  # it is busy, so pytest must run serially — never add `-n`/xdist here. A new e2e
  # file under climate/tests/e2e/ is picked up automatically.
  climate-e2e:
    name: Climate host e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same pins as climate/tests/pyproject.toml (esphome is pinned deliberately).
      - name: Install ESPHome + e2e deps (repo pins)
        run: pip install "esphome==2026.8.0" pytest pytest-asyncio aioesphomeapi
      - name: Generate CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh
      - name: Cache PlatformIO (host/native toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-host-${{ runner.os }}-esphome-2026.8.0
      - name: Climate e2e (host harnesses)
        run: python3 -m pytest climate/tests/e2e

  # Full ESP32/RP2040 compiles. They gate every PR, not only pushes to main:
  # `esphome config` never compiles the C++ lambdas, the `includes:` headers or the
  # ESPHome-internal APIs, so this is the only check that keeps code that does not
  # build out of main. The esp-idf build is heavy; the toolchain cache below and the
  # workflow's cancel-in-progress keep the per-PR cost down. PRs read the cache that
  # main's runs save. (The host e2e runs in `climate-e2e` above.)
  esphome-compile:
    name: ESPHome compile gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ESPHome (repo pin)
        run: pip install "esphome==2026.8.0"
      - name: Generate CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
          key: pio-${{ runner.os }}-esphome-2026.8.0
      - name: Compile sensor-node fixture
        run: esphome compile canbus/tests/compile_sensor_node.yaml
      # The three bridge fixtures are the only compile coverage for the second MCP2515
      # (boards/canbed-rp2040-can1.yaml), for two canbus instances sharing one SPI bus,
      # for boards/lilygo-t-2can.yaml, and for the HighFrequencyLoopRequester call in
      # packages/bridge.yaml — an ESPHome-internal API that config validation cannot
      # exercise (ADR-0017 §6), in both its ON (CANBed) and OFF (T-2CAN) forms.
      # The two CANBed ones are RP2040 builds reusing the toolchain cached above; the
      # T-2CAN one is an ESP32-S3 esp-idf build, sharing the climate controller's.
      - name: Compile bridge fixture
        run: esphome compile canbus/tests/compile_bridge.yaml
      - name: Compile buttons+bridge fixture
        run: esphome compile canbus/tests/compile_buttons_bridge.yaml
      - name: Compile T-2CAN bridge fixture
        run: esphome compile canbus/tests/compile_bridge_t2can.yaml
      - name: Compile climate controller
        run: esphome compile devices/locals/climate-control.yaml
