# =============================================================================
# compile_bridge.yaml — compile-check for the CANBed segment bridge
# =============================================================================
# Hand-maintained (NOT generated): validates that node_core, the CANBed board, the
# second-MCP2515 add-on, and the forwarding package build together without touching
# the generated nodes/ output. Mirrors a `bridge` profile row.
#
# This is the ONLY compile gate covering boards/canbed-rp2040-can1.yaml and the
# two-MCP2515-on-one-SPI-bus arrangement, so keep it in the verification battery even
# when no bridge row exists in the registry yet.
#
# node_id 999 is a scratch value — nothing reserves it, so NEVER flash this to hardware.
#
#   esphome config  canbus/tests/compile_bridge.yaml
#   esphome compile canbus/tests/compile_bridge.yaml
# =============================================================================

substitutions:
  node_id: "999"

esphome:
  name: bridge_999
  friendly_name: "Bridge 999"

packages:
  core: !include ../packages/node_core.yaml
  board: !include ../../boards/canbed-rp2040.yaml
  can1_board: !include ../../boards/canbed-rp2040-can1.yaml
  bridge: !include ../packages/bridge.yaml
