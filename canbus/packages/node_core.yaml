# =============================================================================
# node_core.yaml — identity, globals, and heartbeat: common to EVERY profile
# =============================================================================
# Was base_node.yaml until ADR-0017. The 8-button set moved to buttons_8.yaml so
# a profile with no switch plate (`bridge`) does not instantiate 8 gpio
# binary_sensors on floating pins and emit phantom presses.
#
# Composed by every generated node in canbus/nodes/, alongside exactly the
# packages its registry `profile` selects (generate_nodes.py PROFILES).
#
# Required substitutions:
#   ${node_id}  (the node's only identity)
#
# BOARD-AGNOSTIC (ADR-0017 amendment, 2026-08-04). This file deliberately does
# NOT include a board package: the profile brings its own, because bridges may
# run on the LilyGO T-2CAN (ESP32-S3) while every other profile runs on the
# CANBed RP2040. All this file needs from a board is that it declare `can0`
# (invariant 1 below). A board include here would collide with two platform
# blocks the moment a non-CANBed profile exists.
#
# Flat node_id model (ADR-0007): the node's only identity is its node_id, carried in the
# 29-bit Extended CAN ID. room/board/behaviour live in a central node_id->{...} map on the
# controller/HA — never on the node. TX ids are computed at send time via can_id(CAT_*, node_id).
#
# --- Two invariants that keep this file profile-agnostic (ADR-0017 §3) ---
#
# 1. can0 is ALWAYS the controller-facing port, on every board. On a plain node
#    it is the only port; on a CANBed bridge it is the onboard MCP2515; on a
#    T-2CAN bridge it is the built-in TWAI controller. can1, where present, is
#    always the zone side. So the heartbeat below says id(can0) with no
#    conditional and is correct for every profile on every board. This is
#    forced, not merely chosen: neither controller receives its own
#    transmissions, so a heartbeat sent on a bridge's zone side would never be
#    picked up by that bridge's own forwarding handler.
#
# 2. error_flags is the SHARED contribution point, and this file is its only
#    transmitter. A profile package reports by OR-ing its own ERR_* bit into
#    id(error_flags) — see bridge.yaml. The ERR_* bits in canbus_protocol.h are
#    disjoint, so they compose in the single heartbeat byte. Never add a second
#    CAT_STATUS interval in a profile package: one node_id, one heartbeat.
# =============================================================================

esphome:
  includes:
    - ../protocol/canbus_protocol.h
  on_boot:
    priority: 200
    then:
      - lambda: |-
          ESP_LOGI("canbus", "Node ${node_id} online");
          ESP_LOGI("canbus", "  Input  CAN ID: 0x%08X", can_id(CAT_INPUT,  ${node_id}));
          ESP_LOGI("canbus", "  Status CAN ID: 0x%08X", can_id(CAT_STATUS, ${node_id}));

globals:
  - id: error_flags
    type: uint8_t
    initial_value: "0"
  # millis() is uint32 ms and wraps every ~49.7 days. Count the wraps so reported uptime
  # survives past the ms ceiling (the 30s heartbeat observes every wrap — see below).
  - id: uptime_rollovers
    type: uint16_t
    initial_value: "0"
  - id: last_millis
    type: uint32_t
    initial_value: "0"

# --------------- Heartbeat every 30 seconds ---------------
interval:
  - interval: 30s
    then:
      - lambda: |-
          // millis() is uint32 ms and wraps every ~49.7 days. The 30s heartbeat reliably
          // observes each wrap (a wrap can't hide between two ticks), so count rollovers to
          // reconstruct true uptime, then report hours as a uint16 saturating at 65535 (~7.5yr).
          uint32_t now = millis();
          if (now < id(last_millis)) id(uptime_rollovers) += 1;
          id(last_millis) = now;
          uint64_t ms = ((uint64_t) id(uptime_rollovers) << 32) | now;
          uint64_t hours = ms / 3600000ULL;
          uint16_t uptime_h = hours > 65535ULL ? 65535 : (uint16_t) hours;
          id(can0).send_data(can_id(CAT_STATUS, ${node_id}), true,
                             heartbeat_payload(uptime_h, id(error_flags)));
