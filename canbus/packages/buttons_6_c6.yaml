# =============================================================================
# buttons_6_c6.yaml — the 6-button set of the ESP32-C6 wall node (btn0–btn5)
# =============================================================================
# Counterpart of buttons_8.yaml for hardware/nodo503/: same button.yaml, same
# 0-based indexing, six inputs instead of eight. Selected by the `buttons-c6`
# registry profile (generate_nodes.py PROFILES).
#
#   J3 (left of the module):  btn0 = GPIO7, btn1 = GPIO0, btn2 = GPIO1
#   J4 (right of the module): btn3 = GPIO20, btn4 = GPIO19, btn5 = GPIO18
#
# Each input has an external 3.3k pull-up and a 1k series resistor with 100 nF to
# ground; button.yaml additionally enables the internal pull-up, which is in parallel
# with the 3.3k and changes nothing measurable. Pressed = low, button.yaml inverts.
# J4 is only wired with more than three buttons; on most nodes btn3–btn5 stay unconnected,
# idle high on the pull-up and never fire.
#
# Required substitutions:
#   ${node_id}, ${debounce_ms}
# =============================================================================

packages:
  btn0: !include { file: button.yaml, vars: { button_index: "0", button_gpio: "7" } }
  btn1: !include { file: button.yaml, vars: { button_index: "1", button_gpio: "0" } }
  btn2: !include { file: button.yaml, vars: { button_index: "2", button_gpio: "1" } }
  btn3: !include { file: button.yaml, vars: { button_index: "3", button_gpio: "20" } }
  btn4: !include { file: button.yaml, vars: { button_index: "4", button_gpio: "19" } }
  btn5: !include { file: button.yaml, vars: { button_index: "5", button_gpio: "18" } }
