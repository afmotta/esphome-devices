# =============================================================================
# Component: radiant.yaml
# Purpose:   Dual-mode radiant floor zone (heating + cooling) with PID control,
#            slow PWM output, manual override, and seasonal mode integration.
#            Extends heat_only_radiant with cool output and dual-mode switching.
#
# Required vars:
#   room_slug                - Room identifier for entity IDs (e.g., "living_room")
#   room_name                - Human-readable room name (e.g., "Living Room")
#   temperature_sensor       - Temperature sensor ID (e.g., sensor.living_room_temp)
#   relay_id                 - Switch ID for the zone valve relay
#   seasonal_mode_id         - ID of the seasonal mode select entity (e.g., "hp_mode")
#
# Optional vars:
#   pwm_period               - Slow PWM cycle period (default: 60s)
#   kp                       - Proportional gain (default: 0.8)
#   ki                       - Integral gain (default: 0.005)
#   kd                       - Derivative gain (default: 0.05)
#   integral_limit           - PID integral magnitude, output units (default: 1.0; see pid.yaml)
#
# Dependencies:
#   - heat_only_radiant.yaml (included automatically)
#     - pid.yaml (included by heat_only_radiant)
#       - pid_sensors.yaml (included by pid)
#   - climate/protocol/pid_direction.h (esphome.includes in the entry point)
#
# Exposes:
#   (all entities from heat_only_radiant.yaml, plus:)
#   climate.{room_slug}_radiant_pid - Extended with cool_output
#   output.{room_slug}_radiant_cool_output - Gated cool-direction output (PID cool_output)
#
# Example:
#   packages:
#     radiant: !include
#       file: packages/components/radiant.yaml
#       vars:
#         room_slug: "living_room"
#         room_name: "Living Room"
#         temperature_sensor: sensor.living_room_temp
#         relay_id: relay_1
#         seasonal_mode_id: "hp_mode"
# =============================================================================

# Required vars (room_slug, room_name, temperature_sensor, relay_id,
# seasonal_mode_id) reach heat_only_radiant.yaml through ESPHome's substitution
# inheritance. The optional tuning vars do NOT: heat_only_radiant.yaml's own
# `defaults:` are merged into the global substitutions first and then win over
# a value this file's caller passed, so pwm_period/kp/ki/kd/integral_limit set on radiant.yaml
# were silently ignored (R-15). They are therefore forwarded explicitly below,
# with the defaults restated here so an omitted var still resolves - keep the
# five values in sync with heat_only_radiant.yaml.
defaults:
  pwm_period: 60s
  kp: 0.8
  ki: 0.005
  kd: 0.05
  integral_limit: 1.0

packages:
  pid: !include
    file: heat_only_radiant.yaml
    vars:
      pwm_period: ${pwm_period}
      kp: ${kp}
      ki: ${ki}
      kd: ${kd}
      integral_limit: ${integral_limit}

# Cool-direction gate (R-01): heat and cool both end at the one radiant valve,
# and the PID does not look at its HEAT/COOL mode when routing a value, so each
# direction forwards only while the heat pump produces matching water (see
# climate/protocol/pid_direction.h). Without this, a room above target in winter
# opened its valve in proportion to the overheating.
output:
  - platform: template
    id: ${room_slug}_radiant_cool_output
    type: float
    write_action:
      - lambda: |-
          id(${room_slug}_radiant_output).set_level(pid_direction::gated_level(
              pid_direction::Direction::COOL, id(${seasonal_mode_id}).current_option().c_str(), state));

climate:
  - id: !extend ${room_slug}_radiant_pid
    cool_output: ${room_slug}_radiant_cool_output

# Seasonal mode handler: override heat_only_radiant's handler to support
# both HEAT and COOL modes (heat_only_radiant only supports HEAT)
select:
  - id: !extend ${seasonal_mode_id}
    on_value:
      then:
        - lambda: |-
            auto call = id(${room_slug}_radiant_pid).make_call();
            if (x == "COOL") {
              call.set_mode(climate::CLIMATE_MODE_COOL);
            } else if (x == "HEAT") {
              call.set_mode(climate::CLIMATE_MODE_HEAT);
            } else {
              call.set_mode(climate::CLIMATE_MODE_OFF);
            }
            call.perform();
