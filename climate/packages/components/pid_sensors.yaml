# =============================================================================
# Component: pid_sensors.yaml
# Purpose:   Expose all PID controller internal signals as diagnostic sensors
#            for monitoring, tuning, and Home Assistant dashboards
#
# Required vars:
#   pid_id                   - ID of the PID climate entity (e.g., "living_room_radiant_pid")
#   pid_name                 - Display name prefix (e.g., "Living Room Radiant PID")
#
# Inherited (entry-point substitution, as in the actuator packages):
#   seasonal_mode_id         - ID of the seasonal mode select ("hp_mode"); is_active
#                              reads it through climate/protocol/pid_direction.h
#
# Exposes:
#   sensor.{pid_id}_result         - PID output value
#   sensor.{pid_id}_error          - PID error (setpoint - actual)
#   sensor.{pid_id}_heat           - Heat output (0-1 range)
#   sensor.{pid_id}_cool           - Cool output (0-1 range)
#   sensor.{pid_id}_proportional   - P term contribution
#   sensor.{pid_id}_integral       - I term contribution
#   sensor.{pid_id}_derivative     - D term contribution
#   sensor.{pid_id}_kp             - Current Kp value
#   sensor.{pid_id}_ki             - Current Ki value
#   sensor.{pid_id}_kd             - Current Kd value
#   binary_sensor.{pid_id}_is_active  - PID is ACTUATING: heating while hp_mode is HEAT or
#                                       cooling while hp_mode is COOL (pump demand, see below)
#   binary_sensor.{pid_id}_is_heating - PID intends to heat (action, ungated)
#   binary_sensor.{pid_id}_is_cooling - PID intends to cool (action, ungated)
#
# is_active vs is_heating/is_cooling (R-01): the PID's `action` is its INTENT and
# is deliberately not gated (the seasonal demand tier reads is_heating/is_cooling
# as intent). The actuators ARE gated on hp_mode (pid_direction.h), so a room above
# target in HEAT season has action COOLING but a shut valve. is_active feeds the
# circulation-pump demand (floor *_any_zone_open sensors, second-floor direct
# pump), so it must mean "water is really being asked for": it applies the same
# gate, otherwise the pump would run against closed valves.
#
# Example:
#   packages:
#     sensors: !include
#       file: packages/components/pid_sensors.yaml
#       vars:
#         pid_id: "living_room_radiant_pid"
#         pid_name: "Living Room Radiant PID"
# =============================================================================

sensor:
  - platform: pid
    name: "${pid_name} Result"
    climate_id: ${pid_id}
    id: ${pid_id}_result
    type: RESULT
  - platform: pid
    name: "${pid_name} Error"
    climate_id: ${pid_id}
    id: ${pid_id}_error
    type: ERROR
  - platform: pid
    name: "${pid_name} Heat"
    climate_id: ${pid_id}
    id: ${pid_id}_heat
    type: HEAT
  - platform: pid
    name: "${pid_name} Cool"
    climate_id: ${pid_id}
    id: ${pid_id}_cool
    type: COOL
  - platform: pid
    name: "${pid_name} Proportional"
    climate_id: ${pid_id}
    id: ${pid_id}_proportional
    type: PROPORTIONAL
  - platform: pid
    name: "${pid_name} Integral"
    climate_id: ${pid_id}
    id: ${pid_id}_integral
    type: INTEGRAL
  - platform: pid
    name: "${pid_name} Derivative"
    climate_id: ${pid_id}
    id: ${pid_id}_derivative
    type: DERIVATIVE
  - platform: pid
    name: "${pid_name} KP"
    climate_id: ${pid_id}
    id: ${pid_id}_kp
    type: KP
  - platform: pid
    name: "${pid_name} KI"
    climate_id: ${pid_id}
    id: ${pid_id}_ki
    type: KI
  - platform: pid
    name: "${pid_name} KD"
    climate_id: ${pid_id}
    id: ${pid_id}_kd
    type: KD

binary_sensor:
  - platform: template
    name: "${pid_name} is Active"
    id: ${pid_id}_is_active
    lambda: |-
      auto action = id(${pid_id}).action;
      return pid_direction::actuating(action == CLIMATE_ACTION_HEATING,
                                      action == CLIMATE_ACTION_COOLING,
                                      id(${seasonal_mode_id}).current_option().c_str());
  - platform: template
    name: "${pid_name} is Heating"
    id: ${pid_id}_is_heating
    lambda: |-
      return id(${pid_id}).action == CLIMATE_ACTION_HEATING;
  - platform: template
    name: "${pid_name} is Cooling"
    id: ${pid_id}_is_cooling
    lambda: |-
      return id(${pid_id}).action == CLIMATE_ACTION_COOLING;
