# =============================================================================
# Component: heat_only_radiant.yaml
# Purpose:   Heat-only radiant floor zone with PID control, slow PWM output,
#            manual override capability, and seasonal mode integration.
#            For zones that only provide heating (no cooling through the floor).
#
# Required vars:
#   room_slug                - Room identifier for entity IDs (e.g., "living_room")
#   room_name                - Human-readable room name (e.g., "Living Room")
#   temperature_sensor       - Temperature sensor ID (e.g., sensor.living_room_temp)
#   relay_id                 - Switch ID for the zone valve relay
#   seasonal_mode_id         - ID of the seasonal mode select entity (e.g., "hp_mode")
#
# Optional vars:
#   pwm_period               - Slow PWM cycle period (default: 60s)
#   kp                       - Proportional gain (default: 0.8)
#   ki                       - Integral gain (default: 0.005)
#   kd                       - Derivative gain (default: 0.05)
#   integral_limit           - PID integral magnitude, output units (default: 1.0; see pid.yaml)
#   (radiant.yaml forwards its own pwm_period/kp/ki/kd/integral_limit to this file, see R-15)
#
# Dependencies:
#   - pid.yaml (included automatically, must be in same directory)
#     - pid_sensors.yaml (included by pid.yaml)
#   - climate/protocol/pid_direction.h (esphome.includes in the entry point)
#   - climate/protocol/radiant_override.h (esphome.includes in the entry point)
#
# Direction gating (R-01): the PID writes through ${room_slug}_radiant_heat_output,
# which forwards its level to ${room_slug}_radiant_output only while the heat pump
# is producing hot water (seasonal mode HEAT) and writes 0 otherwise.
# ${room_slug}_radiant_output stays the final stage (override + slow PWM) that
# other packages (fancoil_boost) write to directly.
#
# Override and sensor loss (R-05). The override switch/value pair is how the
# fancoil_boost coordinator holds the valve open (100 %) and how HA can drive it
# by hand. It replaces the PID level, but it is a convenience on top of the
# control loop, NOT a safety bypass: while the zone's temperature is NaN the
# final stage commands 0 whatever the override says. Reasons: the PID writes 0
# for a NaN sensor ("sensor lost => shut down") and the override used to win
# over that; in cooling the dew point comes from the same sensors, so a blind
# zone held open is a condensation risk nobody is judging. The override switch
# is left as it is (it is restored across reboots and the sensor is NaN until
# its first reading), so the valve returns to the override level when the
# sensor recovers; ${room_slug}_radiant_override_active shows whether the
# override is really holding the valve. fancoil_boost additionally ends a boost
# the moment the sensor is lost. The rule lives in climate/protocol/radiant_override.h.
#
# Pump demand (R-05). A valve held open by the override has no PID action behind
# it, so a floor's circulation-pump demand ORs ${room_slug}_radiant_override_active
# next to ${room_slug}_radiant_pid_is_active for every zone (first-floor.yaml,
# ground-floor.yaml; scripts/verify_seasonal_mode_aggregation.py checks the sums
# are complete).
#
# Exposes:
#   climate.{room_slug}_radiant_pid                - PID climate entity
#   switch.{room_slug}_radiant_override            - Enable/disable output override
#   number.{room_slug}_radiant_override_value      - Override output value (0-100%)
#   output.{room_slug}_radiant_output              - Template output (PID or override)
#   binary_sensor.{room_slug}_radiant_override_active - Override is holding the valve open (pump demand)
#   output.{room_slug}_radiant_heat_output         - Gated heat-direction output (PID heat_output)
#   output.{room_slug}_radiant_pwm                 - Slow PWM driving the relay
#   (plus all pid_sensors entities via pid.yaml)
#
# Example:
#   packages:
#     radiant: !include
#       file: packages/components/heat_only_radiant.yaml
#       vars:
#         room_slug: "bedroom_north"
#         room_name: "Bedroom North"
#         temperature_sensor: sensor.bedroom_north_temp
#         relay_id: relay_3
#         seasonal_mode_id: "hp_mode"
# =============================================================================

defaults:
  pwm_period: 60s
  kp: 0.8
  ki: 0.005
  kd: 0.05
  integral_limit: 1.0

packages:
  pid: !include
    file: pid.yaml
    vars:
      circuit_slug: "${room_slug}_radiant"
      circuit_name: "${room_name} Radiant"
      sensor: ${temperature_sensor}
      kp: ${kp}
      ki: ${ki}
      kd: ${kd}
      integral_limit: ${integral_limit}

# Override mechanism for boost mode
# When override is active, PID output is ignored and override_value is used
# Exposed to HA for manual intervention if needed

# Switch to enable/disable output override
switch:
  - platform: template
    id: ${room_slug}_radiant_override
    name: "${room_name} Radiant Override"
    icon: "mdi:lock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

# Number to set the override output value (0-100%)
number:
  - platform: template
    id: ${room_slug}_radiant_override_value
    name: "${room_name} Radiant Override Value"
    icon: "mdi:percent"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    entity_category: config
    mode: slider

# Template output that respects override flag
# PID writes here; this decides whether to pass through or use override_value,
# and closes the valve while the zone temperature is NaN (see header, R-05)
output:
  - platform: template
    id: ${room_slug}_radiant_output
    type: float
    write_action:
      - lambda: |-
          id(${room_slug}_radiant_pwm).set_level(radiant_override::final_level(
              id(${room_slug}_radiant_override).state,
              id(${room_slug}_radiant_override_value).state,
              id(${temperature_sensor}).state, state));

  # Heat-direction gate between the PID and the final stage above. Wired to the
  # PID's heat_output; radiant.yaml adds the matching cool-direction gate. The
  # rule and its write-order argument live in climate/protocol/pid_direction.h.
  - platform: template
    id: ${room_slug}_radiant_heat_output
    type: float
    write_action:
      - lambda: |-
          id(${room_slug}_radiant_output).set_level(pid_direction::gated_level(
              pid_direction::Direction::HEAT, id(${seasonal_mode_id}).current_option().c_str(), state));

  # Actual slow_pwm output that controls the relay
  - platform: slow_pwm
    id: ${room_slug}_radiant_pwm
    period: ${pwm_period}
    turn_on_action:
      - switch.turn_on: ${relay_id}
    turn_off_action:
      - switch.turn_off: ${relay_id}

climate:
  - id: !extend ${room_slug}_radiant_pid
    heat_output: ${room_slug}_radiant_heat_output

# Pump demand input: the override (boost or manual) is holding the valve open.
# Same rule as the final stage, so demand can never disagree with the valve.
binary_sensor:
  - platform: template
    id: ${room_slug}_radiant_override_active
    name: "${room_name} Radiant Override Active"
    device_class: running
    entity_category: diagnostic
    lambda: |-
      return radiant_override::holds_open(
          id(${room_slug}_radiant_override).state,
          id(${room_slug}_radiant_override_value).state,
          id(${temperature_sensor}).state);

# Seasonal mode handler: automatically switch PID mode based on seasonal mode
# Heat-only zones are disabled during COOL mode
select:
  - id: !extend ${seasonal_mode_id}
    on_value:
      then:
        - lambda: |-
            auto call = id(${room_slug}_radiant_pid).make_call();
            if (x == "HEAT") {
              call.set_mode(climate::CLIMATE_MODE_HEAT);
            } else {
              call.set_mode(climate::CLIMATE_MODE_OFF);
            }
            call.perform();
