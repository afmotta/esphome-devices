# =============================================================================
# Component: pid.yaml
# Purpose:   PID controller wrapper with production-tested presets and
#            automatic diagnostic sensor creation
#
# Required vars:
#   circuit_slug             - Circuit identifier for entity IDs (e.g., "living_room_radiant")
#   circuit_name             - Human-readable circuit name (e.g., "Living Room Radiant")
#   sensor                   - Temperature sensor ID (e.g., sensor.living_room_temp)
#   kp                       - Proportional gain (e.g., 0.8 for radiant, 0.2 for fancoil)
#   ki                       - Integral gain (e.g., 0.005 for radiant, 0.01 for fancoil)
#   kd                       - Derivative gain (e.g., 0.05)
#
# Optional vars:
#   default_target_temperature - Initial setpoint (default: 20.00)
#   visual_min_temperature     - UI minimum temperature (default: 0)
#   visual_max_temperature     - UI maximum temperature (default: 40)
#   visual_temperature_step    - UI temperature increment (default: 0.5)
#   integral_limit             - Magnitude of the PID integral term, in output
#                                units (actuator span 0..1; default: 1.0). The
#                                accumulator already includes ki, so this does
#                                not scale with the gains. See "Integral
#                                windup" below.
#
# Inherited (entry-point substitution, as in the actuator packages):
#   seasonal_mode_id           - ID of the seasonal mode select ("hp_mode")
#
# Integral windup (R-13): ESPHome integrates the error on every sensor update
# whatever the PID mode, clamped to +-1 by default. With the outputs gated on
# hp_mode (R-01) the direction the heat pump is NOT producing used to wind up
# to a full actuator span (room above target on a winter afternoon => integral
# -1 on the gated cool side), so a room that then fell below target stayed
# cold until ki*error had climbed back. The integral is therefore confined to
# the active direction on every hp_mode change: HEAT => [0, +limit], COOL =>
# [-limit, 0]; SANITARY_ONLY keeps the previous bounds. That is right for all
# loop types without knowing them: a heat-only, cool-only or dual loop only
# ever needs integral in the direction the water flows, and the integral of the
# previous season is clamped away on the first update after the flip (see
# pid_direction::integral_bounds). kp/ki/kd are untouched.
#
# Dependencies:
#   - pid_sensors.yaml (included automatically, must be in same directory)
#
# Exposes:
#   climate.{circuit_slug}_pid               - PID climate entity
#   sensor.{circuit_slug}_pid_result         - PID output value (via pid_sensors)
#   sensor.{circuit_slug}_pid_error          - PID error signal (via pid_sensors)
#   sensor.{circuit_slug}_pid_heat           - Heat output 0-1 (via pid_sensors)
#   sensor.{circuit_slug}_pid_cool           - Cool output 0-1 (via pid_sensors)
#   binary_sensor.{circuit_slug}_pid_is_active  - Whether PID is actuating (action matches hp_mode; pump demand)
#
# Example:
#   packages:
#     pid: !include
#       file: packages/components/pid.yaml
#       vars:
#         circuit_slug: "living_room_radiant"
#         circuit_name: "Living Room Radiant"
#         sensor: sensor.living_room_temp
#         kp: 0.8
#         ki: 0.005
#         kd: 0.05
# =============================================================================

defaults:
  visual_min_temperature: 0
  visual_max_temperature: 40
  visual_temperature_step: 0.5
  default_target_temperature: 20.00
  integral_limit: 1.0

packages:
  pid_sensors: !include
    file: pid_sensors.yaml
    vars:
      pid_id: ${circuit_slug}_pid
      pid_name: "${circuit_name} PID"

climate:
  - platform: pid
    id: ${circuit_slug}_pid
    name: "${circuit_name} PID"
    sensor: ${sensor}
    default_target_temperature: ${default_target_temperature}
    control_parameters:
      kp: ${kp}
      ki: ${ki}
      kd: ${kd}
      # Static bounds (ESPHome's own defaults, made explicit and overridable):
      # in force until the first HEAT/COOL hp_mode narrows them below.
      min_integral: -${integral_limit}
      max_integral: ${integral_limit}
    visual:
      min_temperature: ${visual_min_temperature}
      max_temperature: ${visual_max_temperature}
      temperature_step: ${visual_temperature_step}

# Confine the integral to the active direction (see "Integral windup"). Runs on
# every hp_mode publish, including the restore at boot: the select's setup
# (HARDWARE) precedes the PID's (DATA), and the setters only write the
# controller's bounds, which the PID's setup() does not touch.
select:
  - id: !extend ${seasonal_mode_id}
    on_value:
      then:
        - lambda: |-
            float lo, hi;
            if (pid_direction::integral_bounds(x.c_str(), ${integral_limit}, lo, hi)) {
              id(${circuit_slug}_pid).set_min_integral(lo);
              id(${circuit_slug}_pid).set_max_integral(hi);
            }
