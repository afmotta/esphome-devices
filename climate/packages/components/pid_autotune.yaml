# =============================================================================
# Component: pid_autotune.yaml
# Purpose:   Basic PID autotune button — triggers ESPHome's built-in PID
#            auto-tuning procedure for a single PID controller
#
# Required vars:
#   pid_name                 - Display name (e.g., "Living Room Radiant")
#   pid_id                   - PID climate entity to tune (e.g., "living_room_radiant_pid")
#
# Exposes:
#   button.{pid_id}_autotune - Press to start autotuning
#
# Note: For zones with fancoils or boost coordinators, use
#       pid_autotune_with_fancoil.yaml instead — it disables interference
#       sources before starting the autotune procedure.
#
# Direction gating (R-01): the PID's outputs only actuate in the direction the
# heat pump is producing (climate/protocol/pid_direction.h), and the autotuner
# drives the PID output between -1 (cool) and +1 (heat) as usual:
#   - Run it in the season the loop actually works in (hp_mode HEAT for a
#     heating loop, COOL for a cooling one). In the wrong season the actuator
#     stays at 0, the room never responds, and the tune never completes.
#   - Tune dual-output radiant loops (heat_output AND cool_output) in HEAT: the
#     gated cool half-cycle only closes the valve (output 0), so the real swing
#     is 0..1, not -1..+1, and the autotuner's gain estimate comes out about
#     2x too high (relay amplitude d = (max-min)/2, 1 assumed vs 0.5 real);
#     halve kp/ki/kd. Heat-only and cool-only loops already model 0..1
#     correctly. The same holds for a heat_cool fancoil.
#   - The PID must not be OFF (the seasonal handler leaves it OFF in other
#     modes). `boost` fancoils sit OFF until the boost coordinator starts them:
#     set the fancoil PID to COOL by hand before pressing the button.
#
# Example:
#   packages:
#     autotune: !include
#       file: packages/components/pid_autotune.yaml
#       vars:
#         pid_name: "Living Room Radiant"
#         pid_id: "living_room_radiant_pid"
# =============================================================================

button:
  - platform: template
    name: "${pid_name} Autotune"
    id: ${pid_id}_autotune
    icon: "mdi:tune"
    entity_category: config
    on_press:
      - logger.log:
          format: "[Autotune] Starting autotune for ${pid_name}"
          level: INFO
      # Small delay to let things settle
      - delay: 2s
      # Start autotune
      - climate.pid.autotune: ${pid_id}
      - logger.log:
          format: "[Autotune] Autotune started for ${pid_id}"
          level: INFO
