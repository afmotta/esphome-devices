# =============================================================================
# Component: fancoil.yaml
# Purpose:   Fancoil unit zone control with PID, analog 0-10V output, and
#            seasonal mode integration. Uses lower PID gains than radiant
#            systems due to fancoils' faster thermal response.
#
# Role (R-01): `fancoil_role` states what the fancoil is FOR in its room and
# has no default, so every call site must say it. It selects which PID outputs
# exist (fancoil_role_<role>.yaml, included below) and who may switch the PID on:
#   boost      - cooling-only boost layer on top of radiant (soggiorno, cucina).
#                The fancoil_boost coordinator alone sets COOL; the seasonal
#                handler only ever turns the PID OFF, so the
#                {zone}_boost_enabled commissioning gate cannot be bypassed.
#   cool_only  - standalone cooling (locale tecnico): COOL while the heat pump
#                produces chilled water, OFF otherwise.
#   heat_cool  - standalone heating and cooling (sottotetto): HEAT / COOL /
#                OFF following the heat pump mode.
#
# Boot state (R-16): the role file defines the script
# ${room_slug}_fancoil_sync_mode (the PID mode its role wants for the current
# hp_mode); this file runs it on every hp_mode change and once at boot (see the
# hooks at the bottom). Resulting boot mode: boost => OFF unless the boost
# coordinator replays a restored boost; cool_only => COOL iff hp_mode COOL;
# heat_cool => HEAT / COOL / OFF with hp_mode.
# A reboot therefore discards a manual or HA-set fancoil PID mode and returns
# to this role/hp_mode mapping (as an hp_mode change already does); the window
# guard re-asserts OFF if the window is still open. A restored boost surviving
# the boot-time NaN holds on the CAN tier only: on the HA tier the 300 s
# staleness grace exceeds the coordinator's sensor_lost_grace.
#
# Direction gating: ESPHome's PID routes a positive value to heat_output and a
# negative one to cool_output regardless of its HEAT/COOL mode, so a fancoil
# with only cool_output ran whenever the room was too WARM, even in winter. The
# cool output here (and the heat output of `heat_cool`) is a gated template
# output that forwards to ${output_id} only while the heat pump produces
# matching water (climate/protocol/pid_direction.h). Roles without heating wire
# NO heat_output, so the PID never reports "heating" for them.
#
# Required vars:
#   room_slug                - Room identifier for entity IDs (e.g., "living_room")
#   room_name                - Human-readable room name (e.g., "Living Room")
#   temperature_sensor       - Temperature sensor ID (e.g., sensor.living_room_temp)
#   output_id                - Output entity for fancoil control (e.g., analog 0-10V DAC)
#   fancoil_role             - boost | cool_only | heat_cool (see above; no default)
#   seasonal_mode_id         - ID of the seasonal mode select entity (e.g., "hp_mode")
#
# Optional vars:
#   kp                       - Proportional gain (default: 0.2 — tuned for fast fancoil response)
#   ki                       - Integral gain (default: 0.01)
#   kd                       - Derivative gain (default: 0.05)
#   integral_limit           - PID integral magnitude, output units (default: 1.0;
#                              see pid.yaml "Integral windup")
#
# Dependencies:
#   - pid.yaml (included automatically, must be in same directory)
#     - pid_sensors.yaml (included by pid)
#   - fancoil_role_${fancoil_role}.yaml (heat output + seasonal handler)
#   - climate/protocol/pid_direction.h (esphome.includes in the entry point)
#
# Exposes:
#   climate.{room_slug}_fancoil_pid              - PID climate entity
#   output.{room_slug}_fancoil_cool_output       - Gated cool-direction output
#   output.{room_slug}_fancoil_heat_output       - Gated heat output (heat_cool only)
#   (plus all pid_sensors entities via pid.yaml)
#
# Example:
#   packages:
#     fancoil: !include
#       file: packages/components/fancoil.yaml
#       vars:
#         room_slug: "living_room"
#         room_name: "Living Room"
#         temperature_sensor: sensor.living_room_temp
#         output_id: fancoil_dac_living_room
#         fancoil_role: boost
#         seasonal_mode_id: "hp_mode"
# =============================================================================

defaults:
  kp: 0.2
  ki: 0.01
  kd: 0.05
  integral_limit: 1.0

packages:
  pid: !include
    file: pid.yaml
    vars:
      circuit_slug: "${room_slug}_fancoil"
      circuit_name: "${room_name} Fancoil"
      sensor: ${temperature_sensor}
      kp: ${kp}
      ki: ${ki}
      kd: ${kd}
      integral_limit: ${integral_limit}

  # Role-specific part: heat output (heat_cool only) + seasonal mode handler.
  # A missing/misspelt fancoil_role fails the config (undefined substitution /
  # file not found) instead of silently picking a direction.
  role: !include
    file: fancoil_role_${fancoil_role}.yaml

output:
  - platform: template
    id: ${room_slug}_fancoil_cool_output
    type: float
    write_action:
      - lambda: |-
          id(${output_id}).set_level(pid_direction::gated_level(
              pid_direction::Direction::COOL, id(${seasonal_mode_id}).current_option().c_str(), state));

climate:
  - id: !extend ${room_slug}_fancoil_pid
    cool_output: ${room_slug}_fancoil_cool_output

select:
  - id: !extend ${seasonal_mode_id}
    on_value:
      then:
        - script.execute: ${room_slug}_fancoil_sync_mode

# Boot sync (R-16). The seasonal select's restore publishes (and so fires the
# handler above) in its setup (priority HARDWARE), BEFORE the PID's own setup()
# (DATA), whose restore_state_() then overwrites that mode -- and with no saved
# state (first boot, or a new PID after a firmware change) a PID with a
# cool_output starts in COOL regardless of hp_mode. Re-running the sync once
# everything is set up makes the boot mode deterministic.
#
# Written in LIST form with an explicit priority (review R-18): each entry is
# its own trigger, so the -100 here is the priority this hook really runs at.
# (A mapping-form on_boot would be merged with every other package's mapping
# into one trigger with a single surviving priority, and mixed with a list it
# would silently drop a hook; scripts/check_on_boot_form.py forbids it.)
# fancoil_boost.yaml's boot replay is a separate, later trigger (-110), so the
# sync never depends on registration order against the coordinator.
esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: ${room_slug}_fancoil_sync_mode
