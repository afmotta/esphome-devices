# =============================================================================
# Component: mixing_pump.yaml
# Purpose:   Mixing valve + pump control with PID-driven valve position and
#            Dallas temperature sensor for supply water monitoring. The PID
#            controls valve position based on supply temperature; a binary
#            sensor triggers the circulation pump relay.
#
# Required vars:
#   area_slug                - Area identifier for entity IDs (e.g., "ground_floor")
#   area_name                - Human-readable area name (e.g., "Ground Floor")
#   dallas_address           - Dallas temperature sensor address (e.g., "0x01234567890ABCDE")
#   one_wire_bus_id          - One-Wire bus ID (e.g., "one_wire_01")
#   output_id                - Output entity for mixing valve control signal
#   sensor_id                - Binary sensor ID that triggers pump on/off
#   relay_id                 - Switch ID for the circulation pump relay
#
# Inherited substitution (not passed per call site; defined once by the entry
# point, like the room packages' use of it):
#   seasonal_mode_id         - ID of the seasonal mode select entity (e.g., "hp_mode")
#
# Optional vars:
#   kp                       - Proportional gain (default: 0.2)
#   ki                       - Integral gain (default: 0.01)
#   kd                       - Derivative gain (default: 0.0)
#   integral_limit           - PID integral magnitude, output units (default: 1.0;
#                              see pid.yaml "Integral windup")
#   valve_slug               - Valve entity slug (default: "${area_slug}_mixing_valve")
#   valve_name               - Valve display name (default: "${area_name} Mixing Valve")
#
# Dependencies:
#   - pid.yaml (included automatically, must be in same directory)
#     - pid_sensors.yaml (included by pid.yaml)
#   - climate/protocol/pid_direction.h (esphome.includes in the entry point)
#
# Direction gating (R-01): the valve PID's target is a supply-water temperature,
# so its error sign says whether the supply must get hotter or colder. The PID
# does not look at its HEAT/COOL mode when routing a value and heat/cool end at
# the one valve, so each direction is gated on what the heat pump produces:
#   HEAT season: only "supply too cold" (PID value > 0) opens the valve;
#                "supply too hot" closes it.
#   COOL season: only "supply too warm" (PID value < 0) opens the chilled valve;
#                "supply below the dew-point minimum" closes it (without the
#                gate that case opened it MORE — dew-point protection inverted).
#   SANITARY_ONLY: no heating/cooling water, valve held closed.
# A target left over from the other season (weather compensation sets the HEAT
# target, the floors' dew-point protection the COOL one) therefore fails closed
# until the owning coordinator writes the new target.
#
# Exposes:
#   sensor.dallas_{dallas_address}               - Supply water temperature
#   climate.{valve_slug}_pid                     - PID climate for valve control
#   output.{valve_slug}_heat_output              - Gated heat-direction output
#   output.{valve_slug}_cool_output              - Gated cool-direction output
#   binary_sensor.{sensor_id}_wrapped            - Pump trigger wrapper
#   (plus all pid_sensors entities via pid.yaml)
#
# Example:
#   packages:
#     mixing: !include
#       file: packages/components/mixing_pump.yaml
#       vars:
#         area_slug: "ground_floor"
#         area_name: "Ground Floor"
#         dallas_address: "0x01234567890ABCDE"
#         one_wire_bus_id: "one_wire_01"
#         output_id: mixing_valve_output
#         sensor_id: ground_floor_demand
#         relay_id: relay_13
# =============================================================================

defaults:
  kp: 0.2
  ki: 0.01
  kd: 0.0
  integral_limit: 1.0
  valve_slug: "${area_slug}_mixing_valve"
  valve_name: "${area_name} Mixing Valve"

sensor:
  - platform: dallas_temp
    address: ${dallas_address}
    name: "Dallas ${dallas_address}"
    id: dallas_${dallas_address}
    unit_of_measurement: "°C"
    one_wire_id: ${one_wire_bus_id}

packages:
  pid: !include
    file: pid.yaml
    vars:
      circuit_slug: "${valve_slug}"
      circuit_name: "${valve_name}"
      sensor: dallas_${dallas_address}
      kp: ${kp}
      ki: ${ki}
      kd: ${kd}
      integral_limit: ${integral_limit}

output:
  - platform: template
    id: ${valve_slug}_heat_output
    type: float
    write_action:
      - lambda: |-
          id(${output_id}).set_level(pid_direction::gated_level(
              pid_direction::Direction::HEAT, id(${seasonal_mode_id}).current_option().c_str(), state));
  - platform: template
    id: ${valve_slug}_cool_output
    type: float
    write_action:
      - lambda: |-
          id(${output_id}).set_level(pid_direction::gated_level(
              pid_direction::Direction::COOL, id(${seasonal_mode_id}).current_option().c_str(), state));

climate:
  - id: !extend ${valve_slug}_pid
    heat_output: ${valve_slug}_heat_output
    cool_output: ${valve_slug}_cool_output

binary_sensor:
  - platform: template
    id: ${sensor_id}_wrapped
    lambda: |-
      return id(${sensor_id}).state;
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: "return x;"
            then:
              - logger.log:
                  format: "Mixing pump for ${area_name} ON"
              - switch.turn_on: ${relay_id}
            else:
              - logger.log:
                  format: "Mixing pump for ${area_name} OFF"
              - switch.turn_off: ${relay_id}
