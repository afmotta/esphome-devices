# =============================================================================
# Coordinator: seasonal_mode.yaml
# Purpose:     Three-tier seasonal mode selection that automatically manages
#              HEAT/COOL/SANITARY_ONLY transitions based on calendar gates,
#              and demand-driven shoulder season logic.
#
#              Tier 1: Calendar Gates (Hard Locks) — configurable date ranges
#              Tier 2: Weather Intelligence (placeholder for future integration)
#              Tier 3: Demand-Driven Transitions during shoulder seasons
#
# Required vars:
#   seasonal_mode_id         - ID for the mode select entity (e.g., "hp_mode")
#   seasonal_mode_name       - Display name for the mode select (e.g., "Heat Pump Mode")
#   time_id                  - ID of the ESPHome time source (SNTP, DS1307, PCF85063, etc.)
#
# Optional vars:
#   winter_start_month       - Winter lock start month (default: 10 = October)
#   winter_start_day         - Winter lock start day (default: 15)
#   winter_end_month         - Winter lock end month (default: 4 = April)
#   winter_end_day           - Winter lock end day (default: 15)
#   summer_start_month       - Summer lock start month (default: 6 = June)
#   summer_start_day         - Summer lock start day (default: 1)
#   summer_end_month         - Summer lock end month (default: 8 = August)
#   summer_end_day           - Summer lock end day (default: 31)
#   heat_demand_id           - ID of the "any PID requesting heat" binary sensor
#                              (default: "any_pid_requesting_heat")
#   cool_demand_id           - ID of the "any PID requesting cool" binary sensor
#                              (default: "any_pid_requesting_cool")
#   heat_wanted_id           - ID of the "some zone wants heat" binary sensor the
#                              demand tier reads (default: "any_zone_wants_heat")
#   cool_wanted_id           - ID of the "some zone wants cool" binary sensor the
#                              demand tier reads (default: "any_zone_wants_cool")
#   check_interval           - How often to evaluate calendar and demand (default: 1min)
#   demand_confirm_checks    - Consecutive checks a one-sided demand must persist
#                              before the demand tier acts (default: 15)
#   demand_min_dwell_checks  - Checks after ANY hp_mode change during which the
#                              demand tier may not change it again (default: 120)
#
# Dependencies:
#   - climate/protocol/seasonal_demand.h (esphome.includes in the entry point)
#
# Exposes:
#   select.${seasonal_mode_id}                   - Mode selector (HEAT/COOL/SANITARY_ONLY)
#   switch.${seasonal_mode_id}_manual_hold       - Commissioning hold; suspends tiers 1+3
#   switch.${seasonal_mode_id}_demand_enabled    - Opt-in for tier 3 (default OFF)
#   text_sensor.${seasonal_mode_id}_reason       - Why current mode was set
#   text_sensor.${seasonal_mode_id}_season       - Current season classification
#   binary_sensor.${seasonal_mode_id}_summer     - Compatibility: true when COOL
#   binary_sensor.${heat_demand_id}              - Display aggregate (PID actions); stub, extend it
#   binary_sensor.${cool_demand_id}              - Display aggregate (PID actions); stub, extend it
#   binary_sensor.${heat_wanted_id}              - Demand-tier input; safe no-demand stub, extend it
#   binary_sensor.${cool_wanted_id}              - Demand-tier input; safe no-demand stub, extend it
#
# Manual hold (commissioning):
#   The heat pump produces either hot OR chilled water house-wide, and that
#   changeover happens at the source — this select only MIRRORS it so the zone
#   PIDs pick heat-vs-cool behaviour. While ${seasonal_mode_id}_manual_hold is
#   ON (the power-on default), the calendar and demand tiers are suspended and
#   the operator owns the select, so it can be pinned to whatever the source is
#   actually producing. Release it (switch OFF) only once both seasons have been
#   commissioned AND the calendar date ranges above match the installer's real
#   source-changeover schedule — otherwise the calendar can drive the select to
#   a mode the source is not producing.
#
# Demand tier (tier 3, shoulder seasons only; review 2026-11-10 finding 1):
#   OFF by default, behind its own switch (${seasonal_mode_id}_demand_enabled),
#   because it MOVES the select on room demand while the select is meant to
#   mirror the source: turn it on only where the heat pump really follows
#   hp_mode (or the operator changes the source over when the select moves).
#   Releasing the manual hold alone runs the calendar tier only.
#   It reads heat_wanted_id / cool_wanted_id - zone temperature vs setpoint with
#   a deadband (pid_sensors.yaml _wants_heat/_wants_cool), not the PID actions:
#   every zone PID is OFF in SANITARY_ONLY, so the actions could never leave it.
#   A one-sided demand must persist for demand_confirm_checks, no change happens
#   within demand_min_dwell_checks of the last one, and a house wanting heat AND
#   cool at once is left alone (it used to flip HEAT <-> COOL every check).
#   Rules and rationale: climate/protocol/seasonal_demand.h.
#
# Usage note:
#   All four aggregate binary sensors default to false so omission is safe, but
#   production devices MUST !extend them with the real aggregation
#   (scripts/verify_seasonal_mode_aggregation.py checks the entry point's lists):
#
#     binary_sensor:
#       - id: !extend any_pid_requesting_heat      # display
#         lambda: |-
#           return id(pid_zone1_is_heating).state || id(pid_zone2_is_heating).state;
#       - id: !extend any_zone_wants_heat          # demand tier
#         lambda: |-
#           return id(pid_zone1_wants_heat).state || id(pid_zone2_wants_heat).state;
#
# Example:
#   packages:
#     seasonal: !include
#       file: packages/coordinators/seasonal_mode.yaml
#       vars:
#         seasonal_mode_id: "hp_mode"
#         seasonal_mode_name: "Heat Pump Mode"
#         time_id: "sntp_time"
# =============================================================================

defaults:
  winter_start_month: "10"
  winter_start_day: "15"
  winter_end_month: "4"
  winter_end_day: "15"
  summer_start_month: "6"
  summer_start_day: "1"
  summer_end_month: "8"
  summer_end_day: "31"
  heat_demand_id: "any_pid_requesting_heat"
  cool_demand_id: "any_pid_requesting_cool"
  heat_wanted_id: "any_zone_wants_heat"
  cool_wanted_id: "any_zone_wants_cool"
  demand_confirm_checks: "15"
  demand_min_dwell_checks: "120"
  check_interval: 1min

select:
  - platform: template
    name: "${seasonal_mode_name}"
    id: ${seasonal_mode_id}
    options:
      - "HEAT"
      - "COOL"
      - "SANITARY_ONLY"
    icon: mdi:heat-pump
    optimistic: true
    restore_value: true
    # Any hp_mode change (operator, calendar, demand tier; also the restore at
    # boot) restarts the demand tier's dwell and confirmation.
    on_value:
      then:
        - lambda: "seasonal_demand::on_mode_changed(seasonal_demand::state());"

text_sensor:
  - platform: template
    name: "${seasonal_mode_name} Reason"
    id: ${seasonal_mode_id}_reason
    icon: mdi:information-outline

  - platform: template
    name: "Season Classification"
    id: ${seasonal_mode_id}_season
    icon: mdi:calendar-range
    update_interval: ${check_interval}
    lambda: |-
      auto time = id(${time_id}).now();
      if (!time.is_valid()) return {"Unknown"};
      int m = time.month;
      int d = time.day_of_month;

      // Winter Lock
      bool in_winter = (m == ${winter_start_month} && d >= ${winter_start_day}) ||
                       m > ${winter_start_month} || m < ${winter_end_month} ||
                       (m == ${winter_end_month} && d < ${winter_end_day});
      // Summer Lock
      bool in_summer = (m >= ${summer_start_month} && m <= ${summer_end_month});
      // Spring Shoulder: winter_end to summer_start
      bool in_spring_shoulder = (m == ${winter_end_month} && d >= ${winter_end_day}) ||
                                (m > ${winter_end_month} && m < ${summer_start_month});
      // Autumn Shoulder: summer_end+1 to winter_start
      bool in_autumn_shoulder = (m == ${summer_end_month} + 1) ||
                                (m == ${winter_start_month} && d < ${winter_start_day});

      if (in_winter) return {"Winter Lock"};
      if (in_summer) return {"Summer Lock"};
      if (in_spring_shoulder) return {"Spring Shoulder"};
      if (in_autumn_shoulder) return {"Autumn Shoulder"};
      return {"Unknown"};

binary_sensor:
  # Compatibility sensor for components that check cooling mode
  - platform: template
    id: ${seasonal_mode_id}_summer
    name: "Summer Mode"
    internal: true
    lambda: |-
      return id(${seasonal_mode_id}).current_option() == "COOL";

  # Global demand sensors — safe stubs that production device configs MUST !extend
  - platform: template
    id: ${heat_demand_id}
    name: "Any PID Requesting Heat"
    device_class: heat
    lambda: |-
      return false;

  - platform: template
    id: ${cool_demand_id}
    name: "Any PID Requesting Cool"
    device_class: cold
    lambda: |-
      return false;

  # Demand-tier inputs (see header). Stubs: the entry point !extends them.
  - platform: template
    id: ${heat_wanted_id}
    name: "Any Zone Wants Heat"
    entity_category: diagnostic
    lambda: |-
      return false;

  - platform: template
    id: ${cool_wanted_id}
    name: "Any Zone Wants Cool"
    entity_category: diagnostic
    lambda: |-
      return false;

switch:
  # Commissioning hold. Defaults ON so a freshly flashed controller never moves
  # the season select on its own: during bring-up the operator pins it to the
  # mode the source is actually producing, one season at a time.
  - platform: template
    id: ${seasonal_mode_id}_manual_hold
    name: "${seasonal_mode_name} Manual Hold"
    icon: mdi:hand-back-right
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Opt-in for the demand tier. Defaults OFF: see "Demand tier" in the header.
  - platform: template
    id: ${seasonal_mode_id}_demand_enabled
    name: "${seasonal_mode_name} Demand Tier"
    icon: mdi:thermometer-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  - id: ${seasonal_mode_id}_check_calendar
    then:
      - lambda: |-
          auto time = id(${time_id}).now();
          if (!time.is_valid()) return;
          int m = time.month;
          int d = time.day_of_month;

          // Winter Lock
          bool in_winter = (m == ${winter_start_month} && d >= ${winter_start_day}) ||
                           m > ${winter_start_month} || m < ${winter_end_month} ||
                           (m == ${winter_end_month} && d < ${winter_end_day});
          // Summer Lock
          bool in_summer = (m >= ${summer_start_month} && m <= ${summer_end_month});

          if (in_winter) {
             if (id(${seasonal_mode_id}).current_option() != "HEAT") {
                auto call = id(${seasonal_mode_id}).make_call();
                call.set_option("HEAT");
                call.perform();
                id(${seasonal_mode_id}_reason).publish_state("CALENDAR_LOCK");
                ESP_LOGI("seasonal_mode", "Winter Lock: HEAT");
             }
          } else if (in_summer) {
             if (id(${seasonal_mode_id}).current_option() != "COOL") {
                auto call = id(${seasonal_mode_id}).make_call();
                call.set_option("COOL");
                call.perform();
                id(${seasonal_mode_id}_reason).publish_state("CALENDAR_LOCK");
                ESP_LOGI("seasonal_mode", "Summer Lock: COOL");
             }
          } else {
             // Shoulder season entry: reset to SANITARY_ONLY at transition boundaries
             if ((m == ${winter_end_month} && d == ${winter_end_day} && time.hour == 0 && time.minute == 0) ||
                 (m == ${summer_end_month} + 1 && d == 1 && time.hour == 0 && time.minute == 0)) {
                if (id(${seasonal_mode_id}).current_option() != "SANITARY_ONLY") {
                   auto call = id(${seasonal_mode_id}).make_call();
                   call.set_option("SANITARY_ONLY");
                   call.perform();
                   id(${seasonal_mode_id}_reason).publish_state("CALENDAR_LOCK");
                }
             }
          }

  - id: ${seasonal_mode_id}_check_demand
    then:
      - lambda: |-
          auto time = id(${time_id}).now();
          if (!time.is_valid()) return;
          int m = time.month;
          int d = time.day_of_month;

          // Shoulder periods: spring (winter_end to summer_start) and autumn (summer_end+1 to winter_start)
          bool is_shoulder = (m == ${winter_end_month} && d >= ${winter_end_day}) ||
                             (m > ${winter_end_month} && m < ${summer_start_month}) ||
                             (m == ${summer_end_month} + 1) ||
                             (m == ${winter_start_month} && d < ${winter_start_day});

          auto &state = seasonal_demand::state();
          if (!is_shoulder) {
            seasonal_demand::idle(state);
            return;
          }
          const auto target = seasonal_demand::step(
              state, id(${heat_wanted_id}).state, id(${cool_wanted_id}).state,
              id(${seasonal_mode_id}).current_option().c_str(),
              ${demand_confirm_checks}, ${demand_min_dwell_checks});
          if (target == seasonal_demand::Target::NONE) return;
          const char *option = target == seasonal_demand::Target::HEAT ? "HEAT" : "COOL";
          auto call = id(${seasonal_mode_id}).make_call();
          call.set_option(option);
          call.perform();
          id(${seasonal_mode_id}_reason).publish_state("DEMAND");
          ESP_LOGI("seasonal_mode", "Demand Transition: %s", option);

interval:
  - interval: ${check_interval}
    then:
      # The dwell clock runs on every check, also while the tiers are held off.
      - lambda: "seasonal_demand::tick(seasonal_demand::state());"
      # Tiers 1 (calendar) and 3 (demand) are suspended while the hold is on —
      # see "Manual hold (commissioning)" in the header. Tier 3 additionally
      # needs its own opt-in switch ("Demand tier" in the header).
      - if:
          condition:
            switch.is_off: ${seasonal_mode_id}_manual_hold
          then:
            - script.execute: ${seasonal_mode_id}_check_calendar
      - if:
          condition:
            and:
              - switch.is_off: ${seasonal_mode_id}_manual_hold
              - switch.is_on: ${seasonal_mode_id}_demand_enabled
          then:
            - script.execute: ${seasonal_mode_id}_check_demand
          else:
            - lambda: "seasonal_demand::idle(seasonal_demand::state());"
