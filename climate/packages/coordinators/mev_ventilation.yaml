# =============================================================================
# Component: mev_ventilation.yaml
# Purpose:   MEV (Mechanical Extract Ventilation) controller with humidity
#            cascade state machine (event-driven with script delays).
#            Pure controller - no hardware abstraction, no demand calculation.
#
# Required vars:
#   component_id                   - Prefix for entity IDs (e.g., "mev")
#   component_name                 - Friendly name prefix (e.g., "MEV")
#   demand_sensor                  - Aggregated demand sensor ID (0-100%)
#   humidity_sensor                - Humidity sensor ID (for de-escalation)
#   humidity_rate_sensor           - Humidity rate-of-change sensor ID (for escalation)
#   humidity_lower_sensor          - Humidity lower bound sensor ID (for de-escalation)
#   cooling_mode_sensor            - Binary sensor ID: true = cooling season
#   dehumidifier_switch            - Switch ID for dehumidifier control
#   integration_switch              - Switch ID for integration (cooling) control
#   alarm_sensor                   - Binary sensor ID for alarm monitoring
#   fan_speed_number               - Number entity ID for fan speed output
#
# Optional vars (first-boot values of the local tuning numbers, see below;
# afterwards the persisted value wins):
#   min_fan_speed_default          - Minimum fan speed, % (default: 20)
#   escalation_threshold_default   - Escalation fan threshold, % (default: 80)
#   deescalation_threshold_default - De-escalation fan threshold, % (default: 40)
#   escalation_delay_default       - Escalation delay, minutes (default: 10)
#   deescalation_delay_default     - De-escalation delay, minutes (default: 15)
#   update_interval                - Final-fan-speed evaluation period (default: 60s)
#
# Tuning numbers (R-08b): the minimum fan speed, the two cascade thresholds and
# the two cascade delays are persisted template numbers on the controller, not
# imports from Home Assistant helpers. They used to be `homeassistant` sensors,
# which read NaN whenever HA is down or the helper is missing: the thresholds
# then disabled the cascade, the min floor fell back to a guess and the delays
# (`NaN * 60000`) were undefined. A local number keeps the tuned value across HA
# outages and reboots (same pattern as the dew-point/boost thresholds in
# ground-floor.yaml); HA can still tune them (entity_category: config). Ids are
# unchanged, so mev_demand.yaml's `min_output_id` keeps resolving.
#
# Humidity Cascade State Machine (event-driven with script delays):
#   Fan Only ──escalate──▶ Dehumidifying ──escalate──▶ Integration
#   Fan Only ◀──de-escalate── Dehumidifying ◀──de-escalate── Integration
#   (Integration state only available in summer/cooling season)
#   Transitions use template binary sensors (condition evaluation) +
#   scripts with mode:restart (delay timers). on_press starts timer,
#   on_release cancels it.
#
# Exposes:
#   number.{component_id}_min_fan_speed         - Minimum fan speed floor (%)
#   number.{component_id}_escalation_threshold  - Fan % at/above which humidity may escalate
#   number.{component_id}_deescalation_threshold - Fan % below which humidity may de-escalate
#   number.{component_id}_escalation_delay      - Minutes a condition must hold to escalate
#   number.{component_id}_deescalation_delay    - Minutes a condition must hold to de-escalate
#   sensor.{component_id}_final_fan_speed       - Calculated fan speed (0-100%)
#   text_sensor.{component_id}_automation_state - Current state machine status
#   select.{component_id}_humidity_state        - Humidity cascade state selector
#   switch.{component_id}_enabled               - Commissioning gate (default OFF)
#
# Commissioning gate:
#   {component_id}_enabled defaults OFF, so a freshly flashed controller leaves
#   the unit still. Ventilation is commissioned in its own phase, ahead of any
#   cooling: the first floor cools via a radiant CEILING whose dew-point-limited
#   supply only cools safely once MEV dehumidification has pulled the room dew
#   point down. Switching the gate off forces fan speed to 0 (same hard-off path
#   as the alarm) and drops the cascade back to "Fan Only" so the dehumidifier
#   and integration outputs are released.
#
# Example:
#   packages:
#     mev_ctrl: !include
#       file: packages/coordinators/mev_ventilation.yaml
#       vars:
#         component_id: "mev"
#         component_name: "MEV"
#         demand_sensor: mev_max_demand
#         humidity_sensor: bathroom_humidity
#         humidity_rate_sensor: mev_humidity_rate
#         cooling_mode_sensor: summer_mode
#         dehumidifier_switch: mev_dehumidifier
#         integration_switch: mev_integration
#         alarm_sensor: mev_alarm
#         fan_speed_number: mev_fan_speed
#         humidity_lower_sensor: mev_humidity_lower
# =============================================================================

defaults:
  min_fan_speed_default: "20"
  escalation_threshold_default: "80"
  deescalation_threshold_default: "40"
  escalation_delay_default: "10"
  deescalation_delay_default: "15"
  update_interval: 60s

# Local, persisted tuning (see "Tuning numbers" in the header).
number:
  - platform: template
    id: ${component_id}_min_fan_speed
    name: "${component_name} Minimum Fan Speed"
    unit_of_measurement: "%"
    icon: mdi:fan-speed-1
    min_value: 0
    max_value: 30
    step: 5
    initial_value: ${min_fan_speed_default}
    restore_value: true
    optimistic: true
    entity_category: config

  # Cascade hysteresis: escalate at/above the high threshold, de-escalate below
  # the low one. The ranges cannot cross (50 is the only shared value), so the
  # cascade cannot be tuned into oscillation. The minimum fan speed (max 30)
  # also stays below the de-escalation threshold (min 35): final_fan_speed is
  # floored at the minimum, so a minimum at or above the threshold would make
  # `fan < threshold` unreachable and the cascade could never de-escalate.
  - platform: template
    id: ${component_id}_escalation_threshold
    name: "${component_name} Escalation Fan Threshold"
    unit_of_measurement: "%"
    icon: mdi:fan-alert
    min_value: 50
    max_value: 100
    step: 5
    initial_value: ${escalation_threshold_default}
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: ${component_id}_deescalation_threshold
    name: "${component_name} De-escalation Fan Threshold"
    unit_of_measurement: "%"
    icon: mdi:fan-minus
    min_value: 35
    max_value: 50
    step: 5
    initial_value: ${deescalation_threshold_default}
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: ${component_id}_escalation_delay
    name: "${component_name} Escalation Delay"
    unit_of_measurement: "min"
    icon: mdi:timer
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${escalation_delay_default}
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: ${component_id}_deescalation_delay
    name: "${component_name} De-escalation Delay"
    unit_of_measurement: "min"
    icon: mdi:timer-outline
    min_value: 1
    max_value: 120
    step: 1
    initial_value: ${deescalation_delay_default}
    restore_value: true
    optimistic: true
    entity_category: config

sensor:
  # Final Fan Speed (%) - applies min floor and alarm safety
  - platform: template
    name: "${component_name} Final Fan Speed"
    id: ${component_id}_final_fan_speed
    unit_of_measurement: "%"
    icon: mdi:fan-speed-3
    accuracy_decimals: 0
    update_interval: ${update_interval}
    lambda: |-
      // Commissioning gate: unit not yet cleared to run (see header).
      if (!id(${component_id}_enabled).state) {
        return 0.0f;
      }

      // Alarm => demand 0, DELIBERATELY hard-off (decision 2026-07-15, C1):
      // the alarm sensor aggregates all 39 Cappellotto alarm types with no
      // severity mapping, so a blanket minimum-purge floor could force demand
      // onto a unit reporting a motor/frost/condensate fault. 0 is the only
      // demand that is safe for every alarm; the alarm itself is surfaced on
      // the dashboards and the touch UI health line. Revisit only with a
      // per-alarm severity map from the register set (climate/mev_modbus.yaml).
      if (id(${alarm_sensor}).state) {
        return 0.0f;
      }

      float demand = id(${demand_sensor}).state;
      float min_fan = id(${component_id}_min_fan_speed).state;

      if (isnan(demand)) demand = min_fan;

      return std::min(100.0f, std::max(demand, min_fan));
    on_value:
      then:
        - number.set:
            id: ${fan_speed_number}
            value: !lambda "return x;"

# Commissioning gate: OFF until ventilation is cleared to run (see header).
switch:
  - platform: template
    name: "${component_name} Enabled"
    id: ${component_id}_enabled
    icon: mdi:fan
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Diagnostic Sensors
text_sensor:
  - platform: template
    name: "${component_name} Automation State"
    id: ${component_id}_automation_state
    icon: mdi:state-machine
    entity_category: diagnostic

# Humidity Cascade State Machine
select:
  - platform: template
    name: "${component_name} Humidity State"
    id: ${component_id}_humidity_state
    options:
      - "Fan Only"
      - "Dehumidifying"
      - "Integration"
    initial_option: "Fan Only"
    optimistic: true
    restore_value: true
    set_action:
      - if:
          condition:
            lambda: 'return x == "Fan Only";'
          then:
            - switch.turn_off: ${dehumidifier_switch}
            - switch.turn_off: ${integration_switch}
      - if:
          condition:
            lambda: 'return x == "Dehumidifying";'
          then:
            - switch.turn_on: ${dehumidifier_switch}
            - switch.turn_off: ${integration_switch}
      - if:
          condition:
            lambda: 'return x == "Integration";'
          then:
            - switch.turn_on: ${dehumidifier_switch}
            - switch.turn_on: ${integration_switch}

# State Machine Scripts (with built-in delays)
# Scripts use mode: restart - restarting resets the delay timer.
# on_press starts the script, on_release stops it (cancels pending transition).
script:
  - id: ${component_id}_escalate_to_dehumidifying
    mode: restart
    then:
      - text_sensor.template.publish:
          id: ${component_id}_automation_state
          state: "Escalating (Dehum)"
      - delay: !lambda "return id(${component_id}_escalation_delay).state * 60000;"
      - select.set:
          id: ${component_id}_humidity_state
          option: "Dehumidifying"
      - logger.log:
          format: "MEV: Escalated to Dehumidifying"
          level: INFO
          tag: mev

  - id: ${component_id}_escalate_to_integration
    mode: restart
    then:
      - text_sensor.template.publish:
          id: ${component_id}_automation_state
          state: "Escalating (Integration)"
      - delay: !lambda "return id(${component_id}_escalation_delay).state * 60000;"
      - select.set:
          id: ${component_id}_humidity_state
          option: "Integration"
      - logger.log:
          format: "MEV: Escalated to Integration"
          level: INFO
          tag: mev

  - id: ${component_id}_deescalate_to_dehumidifying
    mode: restart
    then:
      - text_sensor.template.publish:
          id: ${component_id}_automation_state
          state: "De-escalating (Dehum)"
      - delay: !lambda "return id(${component_id}_deescalation_delay).state * 60000;"
      - select.set:
          id: ${component_id}_humidity_state
          option: "Dehumidifying"
      - logger.log:
          format: "MEV: De-escalated to Dehumidifying"
          level: INFO
          tag: mev

  - id: ${component_id}_deescalate_to_fan_only
    mode: restart
    then:
      - text_sensor.template.publish:
          id: ${component_id}_automation_state
          state: "De-escalating (Fan)"
      - delay: !lambda "return id(${component_id}_deescalation_delay).state * 60000;"
      - select.set:
          id: ${component_id}_humidity_state
          option: "Fan Only"
      - logger.log:
          format: "MEV: De-escalated to Fan Only"
          level: INFO
          tag: mev

  - id: ${component_id}_update_idle_state
    mode: restart
    then:
      - lambda: |-
          auto state = id(${component_id}_humidity_state).current_option();
          if (state == "Fan Only") {
            id(${component_id}_automation_state).publish_state("Idle");
          } else if (state == "Dehumidifying") {
            id(${component_id}_automation_state).publish_state("Dehumidifying");
          } else if (state == "Integration") {
            id(${component_id}_automation_state).publish_state("Integration");
          }

# State Machine Transition Conditions (event-driven)
binary_sensor:
  - platform: template
    name: "${component_name} Should Escalate to Dehumidifying"
    id: ${component_id}_should_escalate_dehum
    internal: true
    lambda: |-
      if (!id(${component_id}_enabled).state) return false;
      auto state = id(${component_id}_humidity_state).current_option();
      float fan = id(${component_id}_final_fan_speed).state;
      float rate = id(${humidity_rate_sensor}).state;
      float thresh = id(${component_id}_escalation_threshold).state;
      if (isnan(fan) || isnan(rate)) return false;
      return state == "Fan Only" && fan >= thresh && rate > 0.0f;
    on_press:
      - script.execute: ${component_id}_escalate_to_dehumidifying
    on_release:
      - script.stop: ${component_id}_escalate_to_dehumidifying
      - script.execute: ${component_id}_update_idle_state

  - platform: template
    name: "${component_name} Should Escalate to Integration"
    id: ${component_id}_should_escalate_integration
    internal: true
    lambda: |-
      if (!id(${component_id}_enabled).state) return false;
      auto state = id(${component_id}_humidity_state).current_option();
      float fan = id(${component_id}_final_fan_speed).state;
      float rate = id(${humidity_rate_sensor}).state;
      float thresh = id(${component_id}_escalation_threshold).state;
      bool summer = id(${cooling_mode_sensor}).state;
      if (isnan(fan) || isnan(rate)) return false;
      return state == "Dehumidifying" && summer && fan >= thresh && rate > 0.0f;
    on_press:
      - script.execute: ${component_id}_escalate_to_integration
    on_release:
      - script.stop: ${component_id}_escalate_to_integration
      - script.execute: ${component_id}_update_idle_state

  - platform: template
    name: "${component_name} Should De-escalate to Dehumidifying"
    id: ${component_id}_should_deescalate_dehum
    internal: true
    lambda: |-
      auto state = id(${component_id}_humidity_state).current_option();
      float fan = id(${component_id}_final_fan_speed).state;
      float humidity = id(${humidity_sensor}).state;
      float lower = id(${humidity_lower_sensor}).state;
      float thresh = id(${component_id}_deescalation_threshold).state;
      bool summer = id(${cooling_mode_sensor}).state;
      if (isnan(fan) || isnan(humidity) || isnan(lower)) return false;
      return state == "Integration" && (!summer || (humidity < lower && fan < thresh));
    on_press:
      - script.execute: ${component_id}_deescalate_to_dehumidifying
    on_release:
      - script.stop: ${component_id}_deescalate_to_dehumidifying
      - script.execute: ${component_id}_update_idle_state

  # Safety: gate switched off while the cascade was escalated → release the
  # dehumidifier/integration outputs immediately (fan speed is already forced
  # to 0 by the final_fan_speed gate).
  - platform: template
    name: "${component_name} Disabled Override"
    id: ${component_id}_disabled_override
    internal: true
    lambda: |-
      if (id(${component_id}_enabled).state) return false;
      return id(${component_id}_humidity_state).current_option() != "Fan Only";
    on_press:
      - select.set:
          id: ${component_id}_humidity_state
          option: "Fan Only"
      - logger.log:
          format: "MEV: Disabled - cascade released to Fan Only"
          level: INFO
          tag: mev

  - platform: template
    name: "${component_name} Should De-escalate to Fan Only"
    id: ${component_id}_should_deescalate_fan
    internal: true
    lambda: |-
      auto state = id(${component_id}_humidity_state).current_option();
      float fan = id(${component_id}_final_fan_speed).state;
      float humidity = id(${humidity_sensor}).state;
      float lower = id(${humidity_lower_sensor}).state;
      float thresh = id(${component_id}_deescalation_threshold).state;
      if (isnan(fan) || isnan(humidity) || isnan(lower)) return false;
      return state == "Dehumidifying" && humidity < lower && fan < thresh;
    on_press:
      - script.execute: ${component_id}_deescalate_to_fan_only
    on_release:
      - script.stop: ${component_id}_deescalate_to_fan_only
      - script.execute: ${component_id}_update_idle_state
