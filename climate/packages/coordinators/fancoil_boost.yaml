# =============================================================================
# Component: fancoil_boost.yaml
# Purpose:   "Base + Boost" coordinator - automatically activates fancoils when
#            radiant floor cooling reaches its limits. Radiant provides efficient
#            baseline; fancoils activate as a responsive boost layer.
#            Event-driven state machine with native ESPHome components.
#
# Required vars:
#   zone_slug                    - Zone identifier for entity IDs (e.g., "living_room")
#   zone_name                    - Human-readable zone name (e.g., "Living Room")
#   temperature_sensor           - ID of the zone temperature sensor
#   humidity_sensor              - ID of the zone humidity sensor
#   radiant_pid_id               - ID of the radiant PID climate entity
#   radiant_pid_cool_sensor      - ID of the PID cool output sensor (0-1 range)
#   fancoil_pid_id               - ID of the fancoil PID climate entity
#   radiant_override_value_id    - ID of the number entity for radiant override %
#   radiant_override_switch_id   - ID of the switch to enable/disable override
#   radiant_pwm_id               - ID of the slow PWM output for radiant
#   cooling_mode_sensor          - ID of the binary sensor for cooling season
#   temp_threshold_sensor        - ID of the sensor providing temp delta threshold
#   humidity_threshold_sensor    - ID of the sensor providing humidity threshold
#   predictive_minutes_sensor    - ID of the sensor providing predictive boost minutes
#
# Optional vars:
#   min_time_in_state_seconds    - Anti-cycling minimum (default: 600 = 10 min)
#   humidity_hysteresis          - Dead band around humidity threshold (default: 5.0)
#   saturated_output_threshold   - PID output level = "saturated" (default: 0.95)
#   predictive_max_minutes       - Upper clamp of the predictive delay, in
#                                  minutes (default: 120, the range of the
#                                  production number; a NaN or non-positive
#                                  ${predictive_minutes_sensor} is never armed)
#   diagnostics_update_interval  - Poll rate of the temp delta / radiant output
#                                  diagnostic sensors (default: 30s; tests
#                                  compress this)
#   boost_active_global          - Global bool id, true while boost is active
#                                  (default: ${zone_slug}_boost_active)
#   last_mode_change_time_global - Global uint32_t id, millis() of the last
#                                  boost/radiant transition
#                                  (default: ${zone_slug}_last_mode_change_time)
#   last_mode_change_epoch_global - Persisted uint32_t id, epoch seconds of the
#                                  last transition; stamped only while the time
#                                  source is valid, restored across reboots
#                                  (default: ${zone_slug}_last_mode_change_epoch)
#   sensor_lost_grace            - How long ${temperature_sensor} must stay NaN
#                                  during a boost before the boost ends
#                                  (default: 120s; see "Sensor loss" below)
#   time_id                      - Time component id used for epoch stamping
#                                  (default: sntp_time; the test harness
#                                  provides a host-clock time under this id)
#
# Dependencies:
#   - ../components/trend_sensor.yaml (included automatically)
#
# State Machine (event-driven with script delays):
#   Radiant Only ──activate──▶ Fancoil Boost
#   Radiant Only ◀──deactivate── Fancoil Boost
#
# Activation Triggers (OR logic - any one starts timer):
#   1. Reactive:   temp delta > threshold (room too warm for radiant)
#   2. Reactive:   humidity > threshold + hysteresis/2 (limits radiant capacity)
#   3. Predictive: radiant output saturated AND temp not decreasing
#      (uses predictive_minutes as delay - saturation must persist)
#
#   All three are additionally gated on {zone_slug}_boost_enabled, which
#   defaults OFF: hybrid radiant+fancoil operation is the last step of the
#   cooling commissioning campaign, so a freshly flashed controller runs
#   radiant-only until the zone is explicitly cleared for boost. Switching it
#   off while a boost is running drops the zone back to "Radiant Only"
#   immediately, via the same override path as the end-of-cooling-season safety.
#
# Deactivation (AND logic - both must be satisfied):
#   - Temperature: delta <= 0 (target reached)
#   - Humidity:    <= threshold - hysteresis/2 (below dead band)
#
# Sensor loss (R-05): while a boost runs the radiant valve is held open by the
# override (100 %) and the fancoil is in COOL, both of which would otherwise
# outlive a dead room sensor (the delta is NaN, so "target reached" can never
# become true). When ${temperature_sensor} stays NaN - the failover chain is in
# its Emergency tier - for ${sensor_lost_grace}, the boost therefore ends,
# through the same no-delay path as the season / commissioning-gate override,
# and is logged. No boost STARTS while the temperature is NaN, whichever
# trigger fires (no grace there), so a humidity trigger cannot re-arm a boost
# that the sensor-loss path would cancel.
# Why a grace and not an immediate stop: the actuators are already safe the
# instant the reading goes NaN - the radiant final stage closes the valve
# (heat_only_radiant.yaml / radiant_override.h, whatever the override says) and
# ESPHome's PID writes 0 on a NaN input - so the boost STATE only decides what
# happens when the sensor returns. After a reboot the temperature is NaN until
# the first reading (CAN tier: first frame; HA tier: closed until an HA client
# connects); stopping at once would cancel every boost restored from flash.
# With the grace a restored boost survives a reboot whose first reading arrives
# in time, while a real loss still ends the boost after ${sensor_lost_grace}
# (it is then back on the normal anti-cycling path). The grace is a
# delayed_on filter: it restarts from zero for every loss, and a reading that
# comes back inside it cancels the pending stop.
# Exposes:
#   select.{zone_slug}_boost_state                    - Boost state selector
#   switch.{zone_slug}_boost_enabled                   - Commissioning gate (default OFF)
#   text_sensor.{zone_slug}_boost_automation_state     - Current automation status
#   sensor.{zone_slug}_temp_delta                      - Temperature delta from target
#   sensor.{zone_slug}_radiant_output_pct              - Radiant PID output %
#   sensor.{zone_slug}_temp_trend                      - Temperature trend (via trend_sensor)
#   binary_sensor.{zone_slug}_boost_active_sensor      - HA mirror of boost_active_global
#   global.{boost_active_global}                       - raw bool, for external id(x) use
#   global.{last_mode_change_time_global}              - raw uint32_t, for external id(x) use
#
# Example:
#   packages:
#     boost: !include
#       file: packages/coordinators/fancoil_boost.yaml
#       vars:
#         zone_slug: "living_room"
#         zone_name: "Living Room"
#         temperature_sensor: living_room_temp
#         humidity_sensor: living_room_humidity
#         radiant_pid_id: living_room_radiant_pid
#         radiant_pid_cool_sensor: living_room_radiant_pid_cool
#         fancoil_pid_id: living_room_fancoil_pid
#         radiant_override_value_id: living_room_radiant_override_value
#         radiant_override_switch_id: living_room_radiant_override
#         radiant_pwm_id: living_room_radiant_output
#         cooling_mode_sensor: summer_mode
#         temp_threshold_sensor: fancoil_boost_threshold
#         humidity_threshold_sensor: fancoil_humidity_threshold
#         predictive_minutes_sensor: predictive_boost_minutes
# =============================================================================

packages:
  temp_trend: !include
    file: ../components/trend_sensor.yaml
    vars:
      sensor_id: ${zone_slug}_temp_trend
      source_sensor: ${temperature_sensor}
      sensor_name: "${zone_name} Temperature Trend"
      unit_of_measurement: "°C/min"
      accuracy_decimals: "3"
      internal: "true"

defaults:
  min_time_in_state_seconds: 600
  humidity_hysteresis: 5.0
  saturated_output_threshold: 0.95
  diagnostics_update_interval: 30s
  predictive_max_minutes: 120
  sensor_lost_grace: 120s
  boost_active_global: ${zone_slug}_boost_active
  last_mode_change_time_global: ${zone_slug}_last_mode_change_time
  last_mode_change_epoch_global: ${zone_slug}_last_mode_change_epoch
  time_id: sntp_time

# =============================================================================
# Boot: restore the coordinator from the select value persisted in flash.
# restore_value republishes the option but does NOT fire set_action, so a
# reboot mid-boost would otherwise leave the physical outputs (radiant
# override 100%, PWM, fancoil COOL) unset while reporting "Fancoil Boost".
# Re-setting the restored option replays set_action end-to-end; the
# "Radiant Only" case only needs the reported-state resync (replaying it
# would force the fancoil OFF and stomp a legitimate manual HA override).
#
# Priority -110: its own trigger (list form, review R-18), one step AFTER the
# fancoil role's mode sync (fancoil_role_*.yaml, -100) so the replay has the
# last word on the fancoil in the one case where they meet: a restored boost.
# Either order is safe by design (the boost role's sync leaves a running boost
# alone and turns the PID OFF otherwise); the distinct priority just stops the
# result depending on package/registration order.
# =============================================================================
esphome:
  on_boot:
    - priority: -110  # After all components are set up and after the role sync
      then:
        - if:
            condition:
              lambda: 'return id(${zone_slug}_boost_state).current_option() == "Fancoil Boost";'
            then:
              - logger.log:
                  format: "${zone_slug}: reboot during boost - replaying boost outputs"
                  level: INFO
                  tag: boost
              - select.set:
                  id: ${zone_slug}_boost_state
                  option: "Fancoil Boost"
              - script.execute: ${zone_slug}_boost_update_idle
            else:
              - script.execute: ${zone_slug}_boost_update_idle

# =============================================================================
# Raw globals: for external lambdas/scripts to read or assign directly via
# id(x) - not entities. Kept separate from the select's own state so callers
# outside this coordinator (e.g. an autotune routine forcing boost off) don't
# need an entity round-trip.
# =============================================================================
globals:
  - id: ${boost_active_global}
    type: bool
    initial_value: 'false'
  - id: ${last_mode_change_time_global}
    type: uint32_t
    initial_value: '0'
  # Epoch-seconds companion to the millis() timestamp above (CLIMATE C9): the
  # controller has no RTC (ADR-0014 §5), so millis-based "time in mode" resets
  # on reboot. This one persists in flash and is stamped from ${time_id} only
  # while wall time is valid — 0 means "never stamped / unknown". Consumers
  # prefer it over the millis global whenever both time and value are valid.
  - id: ${last_mode_change_epoch_global}
    type: uint32_t
    restore_value: yes
    initial_value: '0'

# =============================================================================
# State: select controls boost mode, set_action drives hardware outputs
# =============================================================================
select:
  - platform: template
    name: "${zone_name} Boost State"
    id: ${zone_slug}_boost_state
    options:
      - "Radiant Only"
      - "Fancoil Boost"
    initial_option: "Radiant Only"
    optimistic: true
    restore_value: true
    icon: mdi:thermostat
    set_action:
      - if:
          condition:
            lambda: 'return x == "Fancoil Boost";'
          then:
            # Lock radiant at 100%
            - number.set:
                id: ${radiant_override_value_id}
                value: 100.0
            - switch.turn_on: ${radiant_override_switch_id}
            - output.set_level:
                id: ${radiant_pwm_id}
                level: 1.0
            # Enable fancoil cooling
            - climate.control:
                id: ${fancoil_pid_id}
                mode: COOL
            - globals.set:
                id: ${boost_active_global}
                value: 'true'
            - globals.set:
                id: ${last_mode_change_time_global}
                value: millis()
            # Stamp wall-clock time only when valid; otherwise keep the last
            # (restored) value — the boot replay runs before SNTP syncs and
            # must not wipe the persisted transition time (CLIMATE C9).
            - lambda: |-
                auto now = id(${time_id}).utcnow();
                if (now.is_valid())
                  id(${last_mode_change_epoch_global}) = (uint32_t) now.timestamp;
            - binary_sensor.template.publish:
                id: ${zone_slug}_boost_active_sensor
                state: true
            - logger.log:
                format: "${zone_slug}: BOOST ACTIVATED - Radiant locked 100%%, Fancoil COOL"
                level: INFO
                tag: boost
      - if:
          condition:
            lambda: 'return x == "Radiant Only";'
          then:
            # Release radiant override - PID resumes control
            - switch.turn_off: ${radiant_override_switch_id}
            # Disable fancoil
            - climate.control:
                id: ${fancoil_pid_id}
                mode: "OFF"
            - globals.set:
                id: ${boost_active_global}
                value: 'false'
            - globals.set:
                id: ${last_mode_change_time_global}
                value: millis()
            # See the boost branch: valid-time-only epoch stamp (CLIMATE C9)
            - lambda: |-
                auto now = id(${time_id}).utcnow();
                if (now.is_valid())
                  id(${last_mode_change_epoch_global}) = (uint32_t) now.timestamp;
            - binary_sensor.template.publish:
                id: ${zone_slug}_boost_active_sensor
                state: false
            - logger.log:
                format: "${zone_slug}: NORMAL MODE - Radiant unlocked (PID resumed), Fancoil OFF"
                level: INFO
                tag: boost

# =============================================================================
# Commissioning gate: OFF until this zone is cleared for hybrid operation.
# =============================================================================
switch:
  - platform: template
    name: "${zone_name} Boost Enabled"
    id: ${zone_slug}_boost_enabled
    icon: mdi:fan-plus
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# =============================================================================
# Diagnostic sensors
# =============================================================================
text_sensor:
  - platform: template
    name: "${zone_name} Boost Automation State"
    id: ${zone_slug}_boost_automation_state
    icon: mdi:state-machine
    entity_category: diagnostic

sensor:
  - platform: template
    id: ${zone_slug}_temp_delta
    name: "${zone_name} Temperature Delta"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: "temperature"
    icon: "mdi:thermometer-lines"
    lambda: |-
      float current = id(${temperature_sensor}).state;
      float target = id(${radiant_pid_id}).target_temperature;
      if (std::isnan(current) || std::isnan(target)) return NAN;
      return current - target;
    update_interval: ${diagnostics_update_interval}

  - platform: template
    id: ${zone_slug}_radiant_output_pct
    name: "${zone_name} Radiant Output"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:percent
    lambda: |-
      float output = id(${radiant_pid_cool_sensor}).state;
      if (std::isnan(output)) return 0.0;
      return output * 100.0;
    update_interval: ${diagnostics_update_interval}

# =============================================================================
# Transition scripts (mode: restart = delay timer, cancellable)
# =============================================================================
script:
  # Reactive activation: anti-cycling delay then boost
  - id: ${zone_slug}_activate_boost
    mode: restart
    then:
      - text_sensor.template.publish:
          id: ${zone_slug}_boost_automation_state
          state: "Activating (reactive)"
      - delay: !lambda "return ${min_time_in_state_seconds} * 1000;"
      - select.set:
          id: ${zone_slug}_boost_state
          option: "Fancoil Boost"
      - logger.log:
          format: "${zone_slug}: Reactive boost transition complete"
          level: INFO
          tag: boost

  # Predictive activation: saturation duration delay then boost.
  # ${predictive_minutes_sensor} is a runtime float (an HA-editable number in
  # production), and an ESPHome delay lambda returns uint32_t: NaN converts to an
  # undefined value and a negative to ~49 days' worth of milliseconds, either
  # of which can fire the boost at once or never (R-08). So the script refuses
  # to arm for a NaN / non-positive value (the reactive triggers still work),
  # and clamps a huge one to ${predictive_max_minutes}.
  - id: ${zone_slug}_activate_boost_predictive
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              float minutes = id(${predictive_minutes_sensor}).state;
              return std::isfinite(minutes) && minutes > 0.0f;
          then:
            - text_sensor.template.publish:
                id: ${zone_slug}_boost_automation_state
                state: "Activating (predictive)"
            - delay: !lambda |-
                float minutes = id(${predictive_minutes_sensor}).state;
                if (!(minutes > 0.0f)) minutes = 0.0f;  // changed since the check: fail short, not undefined
                if (minutes > ${predictive_max_minutes}) minutes = ${predictive_max_minutes};
                return (uint32_t) (minutes * 60000.0f);
            - select.set:
                id: ${zone_slug}_boost_state
                option: "Fancoil Boost"
            - logger.log:
                format: "${zone_slug}: Predictive boost transition complete"
                level: INFO
                tag: boost
          else:
            - logger.log:
                format: "${zone_slug}: Predictive boost not armed - predictive minutes is NaN or not positive"
                level: WARN
                tag: boost

  # Deactivation: anti-cycling delay then radiant only
  - id: ${zone_slug}_deactivate_boost
    mode: restart
    then:
      - text_sensor.template.publish:
          id: ${zone_slug}_boost_automation_state
          state: "Deactivating"
      - delay: !lambda "return ${min_time_in_state_seconds} * 1000;"
      - select.set:
          id: ${zone_slug}_boost_state
          option: "Radiant Only"
      - logger.log:
          format: "${zone_slug}: Deactivation transition complete"
          level: INFO
          tag: boost

  # Update idle display state when conditions clear. Also runs on_boot
  # (priority -110, see esphome.on_boot above) to resync boost_active_global
  # and the HA-visible binary_sensor with whatever option the select restored
  # from flash - set_action only fires on an actual select.set call, which
  # restore_value's boot-time publish_state does not trigger. The boot hook
  # replays the physical outputs for a restored "Fancoil Boost" by re-setting
  # the option (see esphome.on_boot above). last_mode_change_time_global
  # resets to ~0 across a reboot (no RTC - see ADR-0014 §5 - so "time since
  # boot" is the best available approximation).
  - id: ${zone_slug}_boost_update_idle
    mode: restart
    then:
      - lambda: |-
          bool boosting = id(${zone_slug}_boost_state).current_option() != "Radiant Only";
          id(${zone_slug}_boost_automation_state).publish_state(boosting ? "Boost Active" : "Idle");
          id(${boost_active_global}) = boosting;
          id(${zone_slug}_boost_active_sensor).publish_state(boosting);

# =============================================================================
# Condition binary sensors (event-driven transitions)
# on_press  → start timer script
# on_release → cancel timer, update idle state
# =============================================================================
binary_sensor:
  # HA-visible mirror of boost_active_global - push-published from set_action
  # and the on_boot resync, never polled (mirrors fallback_events_sensor's
  # push-publish pattern)
  - platform: template
    name: "${zone_name} Boost Active"
    id: ${zone_slug}_boost_active_sensor
    icon: mdi:fan-auto
    device_class: running
    entity_category: diagnostic

  # Reactive: temperature too high for radiant alone
  - platform: template
    name: "${zone_name} Should Boost (Temp)"
    id: ${zone_slug}_should_boost_temp
    internal: true
    lambda: |-
      if (!id(${zone_slug}_boost_enabled).state) return false;
      if (!id(${cooling_mode_sensor}).state) return false;
      // No boost for a zone whose temperature is unknown (sensor-loss stop below)
      if (isnan(id(${temperature_sensor}).state)) return false;
      auto state = id(${zone_slug}_boost_state).current_option();
      if (state != "Radiant Only") return false;
      float delta = id(${zone_slug}_temp_delta).state;
      float thresh = id(${temp_threshold_sensor}).state;
      if (isnan(delta) || isnan(thresh)) return false;
      return delta > thresh;
    on_press:
      - script.execute: ${zone_slug}_activate_boost
    on_release:
      - script.stop: ${zone_slug}_activate_boost
      - script.execute: ${zone_slug}_boost_update_idle

  # Reactive: humidity too high, limiting radiant capacity
  - platform: template
    name: "${zone_name} Should Boost (Humidity)"
    id: ${zone_slug}_should_boost_humidity
    internal: true
    lambda: |-
      if (!id(${zone_slug}_boost_enabled).state) return false;
      if (!id(${cooling_mode_sensor}).state) return false;
      // No boost for a zone whose temperature is unknown (sensor-loss stop below)
      if (isnan(id(${temperature_sensor}).state)) return false;
      auto state = id(${zone_slug}_boost_state).current_option();
      if (state != "Radiant Only") return false;
      float humidity = id(${humidity_sensor}).state;
      float thresh = id(${humidity_threshold_sensor}).state;
      if (isnan(humidity) || isnan(thresh)) return false;
      float activate = thresh + (${humidity_hysteresis} / 2.0f);
      return humidity > activate;
    on_press:
      - script.execute: ${zone_slug}_activate_boost
    on_release:
      - script.stop: ${zone_slug}_activate_boost
      - script.execute: ${zone_slug}_boost_update_idle

  # Predictive: radiant saturated AND temp not decreasing AND above target
  # Script delay = predictive_minutes (saturation must persist for full duration)
  - platform: template
    name: "${zone_name} Should Boost (Predictive)"
    id: ${zone_slug}_should_boost_predictive
    internal: true
    lambda: |-
      if (!id(${zone_slug}_boost_enabled).state) return false;
      if (!id(${cooling_mode_sensor}).state) return false;
      // No boost for a zone whose temperature is unknown (sensor-loss stop below)
      if (isnan(id(${temperature_sensor}).state)) return false;
      auto state = id(${zone_slug}_boost_state).current_option();
      if (state != "Radiant Only") return false;
      float output = id(${radiant_pid_cool_sensor}).state;
      float delta = id(${zone_slug}_temp_delta).state;
      float trend = id(${zone_slug}_temp_trend).state;
      if (isnan(output) || isnan(delta)) return false;
      bool saturated = output >= ${saturated_output_threshold};
      bool above_target = delta > 0;
      bool not_decreasing = isnan(trend) || trend >= -0.005f;
      return saturated && above_target && not_decreasing;
    on_press:
      - script.execute: ${zone_slug}_activate_boost_predictive
    on_release:
      - script.stop: ${zone_slug}_activate_boost_predictive
      - script.execute: ${zone_slug}_boost_update_idle

  # Deactivation: temp at target AND humidity below lower band
  - platform: template
    name: "${zone_name} Should End Boost"
    id: ${zone_slug}_should_end_boost
    internal: true
    lambda: |-
      auto state = id(${zone_slug}_boost_state).current_option();
      if (state != "Fancoil Boost") return false;
      float delta = id(${zone_slug}_temp_delta).state;
      float humidity = id(${humidity_sensor}).state;
      float thresh = id(${humidity_threshold_sensor}).state;
      if (isnan(delta)) return false;
      bool temp_ok = delta <= 0;
      float deactivate = isnan(thresh) ? 100.0f : thresh - (${humidity_hysteresis} / 2.0f);
      bool humidity_ok = isnan(humidity) || humidity <= deactivate;
      return temp_ok && humidity_ok;
    on_press:
      - script.execute: ${zone_slug}_deactivate_boost
    on_release:
      - script.stop: ${zone_slug}_deactivate_boost
      - script.execute: ${zone_slug}_boost_update_idle

  # Safety: cooling season ended, or the commissioning gate was switched off,
  # while boost was active → immediate deactivation
  - platform: template
    name: "${zone_name} Boost Season Override"
    id: ${zone_slug}_boost_season_override
    internal: true
    lambda: |-
      auto state = id(${zone_slug}_boost_state).current_option();
      if (state != "Fancoil Boost") return false;
      return !id(${cooling_mode_sensor}).state ||
             !id(${zone_slug}_boost_enabled).state;
    on_press:
      - select.set:
          id: ${zone_slug}_boost_state
          option: "Radiant Only"
      - script.execute: ${zone_slug}_boost_update_idle
      - logger.log:
          format: "${zone_slug}: Boost ended - heating season or gate switched off"
          level: INFO
          tag: boost

  # Safety (R-05): the room temperature has been gone for ${sensor_lost_grace}
  # (failover chain in Emergency, or no reading since a reboot) while boost is
  # active -> deactivation, same no-delay path as above. should_end_boost cannot
  # do this: a NaN delta never satisfies "target reached", which left the zone
  # at 100% radiant cooling plus fancoil COOL indefinitely. Reads the sensor
  # itself, not the polled temp_delta.
  # The actuators do not wait for this: the radiant final stage closes the valve
  # and the PIDs write 0 as soon as the reading is NaN. The grace only keeps a
  # boost restored from flash alive across the boot-time NaN (see the header).
  # delayed_on (binary_sensor/filter.cpp, DelayedOnFilter::new_value): a rising
  # edge arms a timeout, a falling edge cancels it and passes the false through;
  # Filter::input de-duplicates, so the template's per-loop republish of the
  # same value does not re-arm the timer.
  - platform: template
    name: "${zone_name} Boost Sensor Lost"
    id: ${zone_slug}_boost_sensor_lost
    internal: true
    lambda: |-
      auto state = id(${zone_slug}_boost_state).current_option();
      if (state != "Fancoil Boost") return false;
      return isnan(id(${temperature_sensor}).state);
    filters:
      - delayed_on: ${sensor_lost_grace}
    on_press:
      - select.set:
          id: ${zone_slug}_boost_state
          option: "Radiant Only"
      - script.execute: ${zone_slug}_boost_update_idle
      - logger.log:
          format: "${zone_slug}: Boost ended - room temperature lost (sensor NaN)"
          level: WARN
          tag: boost
