# =============================================================================
# mev_helpers.yaml — Home Assistant package: the input_number helpers the MEV
# demand stack reads (climate/mev_demand.yaml proportional-demand bounds).
#
# Install: copy into your HA packages directory (or add to `homeassistant:
# packages:`). Without these entities the ESPHome `homeassistant` sensors read
# NaN and every demand signal silently falls back to the flat 20% default
# (proportional_demand_sensor.yaml) — the system runs, but air quality no longer
# modulates the fan.
#
# NOT here any more (R-08b): the minimum fan speed (both MEVs) and the first-floor
# cascade thresholds/delays are persisted `number` entities ON the controller
# (entity_category: config, restore_value), so they survive an HA outage. Tune
# them from the controller device in HA (number.climate_control_mev_primo_piano_*
# and number.climate_control_mev_piano_terra_minimum_fan_speed). If you created
# the old helpers (mev_minimum_fan_speed, ground_floor_mev_minimum_fan_speed,
# mev_escalation_fan_threshold, mev_deescalation_fan_threshold,
# mev_escalation_delay_minutes, mev_deescalation_delay_minutes), delete them —
# nothing reads them.
#
# Bounds map lower_bound → minimum fan and upper_bound → 100% demand
# (proportional between), shared by both MEVs. VOC/NOx are Sensirion index
# values (1-500, ~100 = baseline).
# =============================================================================

input_number:
  # --------------- Proportional demand bounds (mev_demand.yaml) -------------
  mev_co2_lower_bound:
    name: MEV CO2 Lower Bound
    min: 400
    max: 2000
    step: 50
    initial: 600
    unit_of_measurement: ppm
    icon: mdi:molecule-co2
  mev_co2_upper_bound:
    name: MEV CO2 Upper Bound
    min: 400
    max: 3000
    step: 50
    initial: 1500
    unit_of_measurement: ppm
    icon: mdi:molecule-co2
  mev_voc_lower_bound:
    name: MEV VOC Index Lower Bound
    min: 1
    max: 500
    step: 10
    initial: 150
    icon: mdi:air-filter
  mev_voc_upper_bound:
    name: MEV VOC Index Upper Bound
    min: 1
    max: 500
    step: 10
    initial: 400
    icon: mdi:air-filter
  mev_nox_lower_bound:
    name: MEV NOx Index Lower Bound
    min: 1
    max: 500
    step: 10
    initial: 100
    icon: mdi:smog
  mev_nox_upper_bound:
