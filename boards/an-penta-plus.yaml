# =============================================================================
# an-penta-plus.yaml — QuinLED-An-Penta-Plus board hardware
# =============================================================================
# Generic board package for the QuinLED-An-Penta-Plus: a classic-ESP32
# (LAN8720 Ethernet) 5-channel LED controller. This file owns only fixed board
# hardware and the esp32/api/ota/network scaffolding. How the five output
# channels are grouped into light entities (monochrome / CCT / RGB / RGBW),
# what the three onboard buttons do, and whether/how the addressable-LED strip
# on the digital header is driven are application composition and belong in the
# entry point, not here (AD-4: entry-point composition, not board concerns).
#
# Hardware reference (quinled.info An-Penta-Plus pinout + ESPHome example):
#   LED ch1  GPIO33   LED ch2  GPIO32   LED ch3  GPIO12*   LED ch4  GPIO4
#   LED ch5  GPIO2*   Digital-LED data  GPIO5   Digital-LED power relay  GPIO13
#   Buttons  GPIO36 / GPIO39 / GPIO34 (input-only, hardware pull-up + debounce)
#   I2C      SDA GPIO15 / SCL GPIO16       Ethernet LAN8720 (declared below)
#   * GPIO12 (flash-voltage select) and GPIO2 (boot mode) are ESP32 strapping
#     pins; the board is designed around them, so their LEDC outputs set
#     ignore_strapping_warning below.
# =============================================================================

substitutions:
  # Placeholder default only. Every entry point overrides device_name and that
  # override wins for the resolved esphome.name; it exists so ESPHome's
  # substitution engine can eagerly evaluate the ${device_name} references inside
  # the inlined ethernet/wifi text_sensor names below when this board is inspected
  # on its own. friendly_name is deliberately NOT defaulted here — a board-level
  # default would override the entry point's value.
  device_name: an-penta-plus
  logger_level: INFO

  # Fixed board GPIOs exposed so entry points/packages can compose devices on
  # them without hardcoding pins. The five LED channels are declared as raw
  # LEDC outputs below; the digital-LED and button pins are left for the entry
  # point (their behaviour is application policy).
  led_pwm_frequency: "19531Hz" # quinled.info default; low-flicker 8-bit LEDC
  digital_led_data_pin: GPIO5
  digital_led_power_pin: GPIO13
  button_1_pin: GPIO36
  button_2_pin: GPIO39
  button_3_pin: GPIO34
  # QWIIC/STEMMA-QT expansion header (GPIO15 SDA, GPIO16 SCL, +3V3, GND). Left UNCLAIMED by the
  # board so an entry point decides its use (I2C, or — in the CAN-actuator deployment, ADR-0020 —
  # an external SN65HVD230 CAN transceiver: SCL->CTX as TWAI tx, SDA->CRX as TWAI rx). GPIO15 is a
  # strapping pin, and CRX idles high (recessive) = its required boot level, so SDA=rx is the safe
  # assignment.
  qwiic_scl_pin: GPIO16 # SCL — CAN tx (to transceiver CTX) in the actuator deployment
  qwiic_sda_pin: GPIO15 # SDA — CAN rx (from transceiver CRX) in the actuator deployment

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Repo toolchain floor (not an An-Penta hardware requirement); keeps every
  # entry point on one ESPHome baseline. 2026.8.0 is also the floor for the
  # multi-interface `network:` block below.
  min_version: 2026.8.0
  comment: "QuinLED-An-Penta-Plus"

# Classic ESP32 (ESP32-WROOM) — required for the LAN8720 RMII Ethernet PHY.
esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: ${logger_level}

# Enable Home Assistant API
api:
  encryption:
    key: ${encryption_key}

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: ${ota_password}

# --------------------------------------------------------------------------
# Network — both interfaces declared together. ESPHome 2026.8.0 multi-interface
# networking picks the active one at runtime from the `network: priority:` list
# and fails over automatically, replacing the former mutually-exclusive
# `enable_ethernet` toggle plus the swappable an-penta-plus-ethernet.yaml /
# an-penta-plus-wifi.yaml packages (merged inline here). Ethernet is preferred
# (the board's onboard LAN8720) with WiFi as the fallback; the HA-down actuation
# path is CAN regardless (led_can_actuator.yaml, ADR-0020), independent of both.
#
# Note: on the classic ESP32 both network stacks run at once. If RAM proves tight
# at bring-up, add `enable_on_boot: false` to the wifi block and start it from an
# action on ethernet loss instead (ESPHome network docs); that trades automatic
# failover for lower boot-time footprint.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  # 50 MHz RMII reference clock driven out on GPIO17 (was clk_mode: GPIO17_OUT,
  # deprecated in 2026.7 / removed 2026.9).
  clk:
    mode: CLK_OUT
    pin: 17
  phy_addr: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# # Enable AP when WiFi connection fails
# ap:
#   ssid: ${device_name} AP
#   password: !secret wifi_hotspot_pass
# captive_portal:

# ESPHome 2026.8.0 requires both interfaces to be listed here whenever ethernet
# and wifi are declared together; the first entry wins the default route.
network:
  priority:
    - ethernet
    - wifi

# Per-interface diagnostics. Both info platforms coexist under multi-interface
# networking; only the top-level IP-address names are qualified (Ethernet / Wi-Fi)
# so the two do not collide on one entity name.
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "${device_name} - Ethernet IP Address"
      address_0:
        name: "${device_name} - IP Address 0"
      address_1:
        name: "${device_name} - IP Address 1"
      address_2:
        name: "${device_name} - IP Address 2"
      address_3:
        name: "${device_name} - IP Address 3"
      address_4:
        name: "${device_name} - IP Address 4"
    dns_address:
      name: "${device_name} - DNS Address"
    mac_address:
      name: "${device_name} - MAC Address"
  - platform: wifi_info
    ip_address:
      name: "${device_name} - Wi-Fi IP Address"
    ssid:
      name: "${device_name} - Wi-Fi SSID"
    bssid:
      name: "${device_name} - Wi-Fi BSSID"

# The QWIIC/expansion header (GPIO15/GPIO16) is intentionally NOT claimed here — it is exposed
# as qwiic_sda_pin/qwiic_scl_pin substitutions above and an entry point decides its use (AD-4).
# In this repo the An-Penta is a CAN LED actuator (ADR-0020), so the entry point composes a CAN
# transceiver on those pins rather than an I2C bus.

# Five LEDC PWM channels — the board's fixed, defining hardware, given stable
# ids (led_ch1..led_ch5). Entry points build light entities on top of these
# raw outputs, which by themselves impose no colour-mode policy.
output:
  - platform: ledc
    id: led_ch1
    pin: GPIO33
    frequency: ${led_pwm_frequency}
  - platform: ledc
    id: led_ch2
    pin: GPIO32
    frequency: ${led_pwm_frequency}
  - platform: ledc
    id: led_ch3
    pin:
      number: GPIO12 # strapping pin (flash voltage); board is designed for it
      ignore_strapping_warning: true
    frequency: ${led_pwm_frequency}
  - platform: ledc
    id: led_ch4
    pin: GPIO4
    frequency: ${led_pwm_frequency}
  - platform: ledc
    id: led_ch5
    pin:
      number: GPIO2 # strapping pin (boot mode); board is designed for it
      ignore_strapping_warning: true
    frequency: ${led_pwm_frequency}

binary_sensor:
  - platform: status
    name: "Status"

# Virtual buttons (no GPIO) — standard board maintenance controls.
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config
