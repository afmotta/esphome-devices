substitutions:
  logger_level: INFO

esphome:
  name: ${device_name}
  # Repo baseline; a6/a16 (which compose this) now declare a multi-interface network:.
  min_version: 2026.8.0
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: ${logger_level}

api:
  encryption:
    key: ${encryption_key}

ota:
  - platform: esphome
    password: ${ota_password}
