packages:
  base: !include base.yaml

# Network — both interfaces declared inline; ESPHome 2026.8.0 multi-interface
# networking (network: priority:) picks the active one at runtime with automatic
# failover, replacing the former enable_ethernet toggle + the a16_ethernet.yaml /
# wifi.yaml split. Ethernet preferred, WiFi fallback. (Gen-1 board with no current
# consumer — modernized for consistency; not compile-verified in this environment.)
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  # 50 MHz RMII reference clock out on GPIO17 (was clk_mode: GPIO17_OUT,
  # deprecated in 2026.7 / removed 2026.9).
  clk:
    mode: CLK_OUT
    pin: 17
  phy_addr: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

network:
  priority:
    - ethernet
    - wifi

uart:
  - id: rs485
    tx_pin: GPIO13
    rx_pin: GPIO16
    baud_rate: 9600

i2c:
  sda: GPIO4
  scl:
    number: GPIO5
    ignore_strapping_warning: true

pcf8574:
  - id: inputs_1_8
    address: 0x22
    pcf8575: false
  - id: inputs_9_16
    address: 0x21
    pcf8575: false
  - id: outputs_1_8
    address: 0x24
    pcf8575: false
  - id: outputs_9_16
    address: 0x25
    pcf8575: false

