# Ethernet configuration - mutually exclusive with WiFi!
#
# The W5500's SCLK/MOSI/MISO are physically shared with the onboard ST7796
# display (display CS=21, W5500 CS=10 keep them distinct on the bus).
#
# CORRECTED 2026-07-25: an earlier version of this comment claimed the display
# could sit on a second controller (`interface: spi3`) and reach the same pads
# through the GPIO matrix. It cannot — an ESP32-S3 pad has one output source, so
# the W5500 simply took the pads and the panel never received a frame. On a
# touchscreen build the display now shares THIS controller (spi2) and the two
# devices are arbitrated by their CS lines. See boards/t-connect-pro-display.yaml
# for the full mechanism and ADR-0016 for the decision.
#
# `allow_other_uses` is still needed whenever both blocks name these pads, but
# ESPHome rejects a lone `allow_other_uses: true` when nothing else claims the
# pin, so it stays gated on `shared_spi_pins` (default false). Screen-less builds
# leave it false and are entirely unaffected by any of this.
ethernet:
  type: W5500
  # Explicit rather than implied: ESPHome already defaults non-classic ESP32
  # variants to spi2, but the shared-bus arrangement DEPENDS on this matching
  # the display bus's `interface:`, so it is spelled out.
  interface: spi2
  clk_pin:
    number: GPIO12
    allow_other_uses: ${shared_spi_pins}
  mosi_pin:
    number: GPIO11
    allow_other_uses: ${shared_spi_pins}
  miso_pin:
    number: GPIO13
    allow_other_uses: ${shared_spi_pins}
  cs_pin: GPIO10
  interrupt_pin: GPIO9
  reset_pin: GPIO48
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "${device_name} - IP Address"
      address_0:
        name: "${device_name} - IP Address 0"
      address_1:
        name: "${device_name} - IP Address 1"
      address_2:
        name: "${device_name} - IP Address 2"
      address_3:
        name: "${device_name} - IP Address 3"
      address_4:
        name: "${device_name} - IP Address 4"
    dns_address:
      name: "${device_name} - DNS Address"
    mac_address:
      name: "${device_name} - MAC Address"
