substitutions:
  # Placeholder default only. Every real entry point overrides this (climate via
  # its `defaults:`, lighting via its `substitutions:`), and that override always
  # wins for the resolved esphome.name. It exists solely so ESPHome's substitution
  # engine can eagerly evaluate the ${device_name} references inside the inlined
  # ethernet/wifi text_sensor names below when this board is inspected on its own.
  # friendly_name is deliberately NOT defaulted here — a board-level default for it
  # would (unlike device_name) override the entry point's value.
  device_name: t-connect-pro
  logger_level: INFO
  # "true" only when the onboard display shares the W5500's SPI pads
  # (boards/t-connect-pro-display.yaml); the touchscreen build sets it. Marking
  # the ethernet SPI pins allow_other_uses is invalid unless the display bus
  # actually co-claims them, so this stays "false" for screen-less builds.
  shared_spi_pins: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  comment: "LilyGO T-Connect Pro"

# LilyGO T-Connect Pro uses ESP32-S3-R8 (WROOM module)
# -> 16 MB flash
# -> 8 MB octal PSRAM
#
# Also present but unclaimed by this board file (AD-4: entry-point
# composition, not board concerns): onboard TWAI CAN transceiver on
# TX=IO6/RX=IO7 (would be canbus's health.yaml if this board were ever
# composed into a CAN-consuming entry point; unconsumed by hvac today).
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: ${logger_level}

# Enable Home Assistant API
api:
  encryption:
    key: ${encryption_key}

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: ${ota_password}

# --------------------------------------------------------------------------
# Network — both interfaces declared together. ESPHome 2026.8.0 multi-interface
# networking picks the active one at runtime from the `network: priority:` list
# and fails over automatically (within milliseconds), so there is no longer a
# compile-time choice: this replaces the former mutually-exclusive
# `enable_ethernet` toggle plus the swappable t-connect-pro-ethernet.yaml /
# t-connect-pro-wifi.yaml packages, now merged inline here. Ethernet is preferred
# (ADR-0014 wired networking) with WiFi as the fallback.
#
# The W5500's SCLK/MOSI/MISO (GPIO12/11/13) are the same physical pads as the
# onboard ST7796 display. On a screen-less build the W5500 owns them outright
# (shared_spi_pins "false"). On a touchscreen build the display co-claims them and
# the two share ONE SPI controller (spi2), arbitrated by their CS lines — which is
# what shared_spi_pins "true" plus the local `ethernet` fork enable. See
# boards/t-connect-pro-display.yaml for the mechanism and ADR-0016 for the decision.
#
# `allow_other_uses` is still needed whenever both blocks name these pads, but
# ESPHome rejects a lone `allow_other_uses: true` when nothing else claims the
# pin, so it stays gated on `shared_spi_pins` (default false).
ethernet:
  type: W5500
  # Explicit rather than implied: ESPHome already defaults non-classic ESP32
  # variants to spi2, but the shared-bus arrangement DEPENDS on this matching
  # the display bus's `interface:`, so it is spelled out.
  interface: spi2
  clk_pin:
    number: GPIO12
    allow_other_uses: ${shared_spi_pins}
  mosi_pin:
    number: GPIO11
    allow_other_uses: ${shared_spi_pins}
  miso_pin:
    number: GPIO13
    allow_other_uses: ${shared_spi_pins}
  cs_pin: GPIO10
  interrupt_pin: GPIO9
  reset_pin: GPIO48

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# # Enable AP when WiFi connection fails
# ap:
#   ssid: ${device_name} AP
#   password: !secret wifi_hotspot_pass
# captive_portal:

# ESPHome 2026.8.0 requires both interfaces to be listed here whenever ethernet
# and wifi are declared together; the first entry wins the default route.
network:
  priority:
    - ethernet
    - wifi

# Per-interface diagnostics. Both info platforms coexist under multi-interface
# networking; only the top-level IP-address names are qualified (Ethernet / Wi-Fi)
# so the two do not collide on one entity name.
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "${device_name} - Ethernet IP Address"
      address_0:
        name: "${device_name} - IP Address 0"
      address_1:
        name: "${device_name} - IP Address 1"
      address_2:
        name: "${device_name} - IP Address 2"
      address_3:
        name: "${device_name} - IP Address 3"
      address_4:
        name: "${device_name} - IP Address 4"
    dns_address:
      name: "${device_name} - DNS Address"
    mac_address:
      name: "${device_name} - MAC Address"
  - platform: wifi_info
    ip_address:
      name: "${device_name} - Wi-Fi IP Address"
    ssid:
      name: "${device_name} - Wi-Fi SSID"
    bssid:
      name: "${device_name} - Wi-Fi BSSID"

# I2C bus — SDA=IO39/SCL=IO40, shared by every T-Connect Pro (onboard touch
# controller plus any entry-point-added devices, e.g. hvac's DS2484 1-Wire
# bridge). Bus only; no devices declared here — device-specific I2C
# peripherals are entry-point composition (AD-4), not board-file concerns.
i2c:
  - id: i2cbus
    sda: GPIO39
    scl: GPIO40
    scan: false
    frequency: 100kHz

# RS485 / Modbus — same physical pins as the previous waveshare-s3 board
uart:
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 38400
    stop_bits: 1 #default to 8E1
    data_bits: 8 #default to 8E1
    parity: EVEN #default to 8E1

binary_sensor:
  - platform: status
    name: "Status"

  - platform: gpio
    name: "Boot Button"
    pin:
      number: 0
      ignore_strapping_warning: true
      mode:
        input: true
      inverted: true
    disabled_by_default: true
    on_press:
      then:
        - button.press: restart_button

# Virtual buttons
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config
